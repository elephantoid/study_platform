# 기동: docker compose up -d --build     안내: docs/SELF_HOSTING.md
name: study-platform

services:
  web:
    image: ghcr.io/elephantoid/study_platform-web:${IMAGE_TAG:-local}
    build:
      context: .
      target: web
      args:
        STUDY_SHOW_DRAFT: ${STUDY_SHOW_DRAFT:-0}
        NEXT_PUBLIC_DEMO_AUTH: ${NEXT_PUBLIC_DEMO_AUTH:-0}
        REVISION: ${REVISION:-unknown}
    ports:
      # 로그인이 없는 앱이라 기본은 이 컴퓨터에서만 열린다.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8090}:3000"
    # 이미지의 HEALTHCHECK 를 그대로 쓴다 (정의는 Dockerfile 한 곳).
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m

  # Rust 읽기 전용 콘텐츠 API (server/, docs/API.md). web 은 이 API 를 부르지 않는다
  # (빌드 때 content/ 를 직접 읽는다). 외부 클라이언트·확인용으로 따로 연다.
  server:
    image: ghcr.io/elephantoid/study_platform-server:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        REVISION: ${REVISION:-unknown}
    ports:
      - "${SERVER_BIND:-127.0.0.1}:${SERVER_PORT:-8091}:8080"
    environment:
      PORT: "8080"
      STUDY_CONTENT_DIR: /app/content
      STUDY_MANIFEST_PATH: /app/pipeline/manifests/videos.json
    # 이미지에 구운 콘텐츠 대신 레포의 것을 읽기 전용으로 쓴다. 콘텐츠를 고친 뒤엔
    # `docker compose restart server` 로 다시 읽는다 (기동 때 검증, 틀리면 뜨지 않는다).
    volumes:
      - ./content:/app/content:ro
      - ./pipeline/manifests/videos.json:/app/pipeline/manifests/videos.json:ro
    # 이미지의 HEALTHCHECK(`study-server --healthcheck`)를 그대로 쓴다.
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  # 일회성 CLI: docker compose run --rm pipeline check
  pipeline:
    profiles: [tools]
    image: ghcr.io/elephantoid/study_platform-pipeline:${IMAGE_TAG:-local}
    build:
      context: ./pipeline
      target: pipeline
      args:
        REVISION: ${REVISION:-unknown}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ./content:/app/content
      - ./pipeline/manifests:/app/pipeline/manifests
      # 자막 원본. 커밋 사고를 막기 위해 레포 밖에 둔다 (CONTRACT §3.1).
      - ${STUDY_RAW_HOST_DIR:-${HOME}/.cache/study-platform/raw}:/data/raw
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
