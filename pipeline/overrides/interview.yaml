boost-algo-004:
  author: {model: claude-opus-5-5, at: 2026-11-25}
  append: |-
    - **최선 $O(N)$의 조건**: 입력이 이미 정렬되어 있으면 원소마다 비교 한 번으로 끝난다. 일반적으로 비용은 역순쌍(inversion) 개수를 $I$라 할 때 $O(N + I)$이다. 최악은 역순 입력으로 $I = N(N-1)/2$이다.
    - **안정성과 공간**: 앞의 값이 **더 클 때만** 자리를 바꾸므로 안정 정렬이다. 제자리 정렬이라 보조 공간은 $O(1)$이다.
    - **작은 배열에서 빠른 이유**: 재귀 호출과 분할 비용이 없고 인접한 메모리만 건드린다. 그래서 실제 라이브러리는 작은 구간에서 삽입 정렬로 바꾼다(Timsort의 짧은 run, introsort의 마지막 단계).
  followUps:
  - promptMd: >-
      모든 원소가 정렬된 위치에서 최대 $k$칸까지만 떨어져 있는 배열이 있습니다. 삽입 정렬의 비용은 얼마이고, $k$가 커지면 어떤 방법으로 바꾸겠습니까?
    hintKo: 역순쌍의 개수로 비용을 세어 보세요. 다음으로 나갈 최솟값이 있을 수 있는 범위도 생각해 보세요.
    rubricKeywords: ["O(Nk)", "역순쌍(inversion) 수에 비례", "크기 k+1 최소 힙", "O(N log k)"]
    modelAnswerKo: |-
      삽입 정렬의 이동 횟수는 역순쌍의 개수와 같습니다. 원소마다 역순쌍을 이루는 상대가 $O(k)$개이므로 전체 비용은 $O(Nk)$입니다. $k$가 작은 상수면 사실상 선형이라 삽입 정렬이 좋은 선택입니다.

      $k$가 커지면 크기 $k+1$의 최소 힙을 씁니다. 다음으로 출력할 최솟값은 아직 출력하지 않은 앞쪽 $k+1$개 안에 반드시 있으므로, 힙에서 하나를 꺼내고 다음 원소를 넣는 일을 반복하면 $O(N \log k)$ 시간, $O(k)$ 공간에 끝납니다. 이 방법은 늦게 도착한 이벤트가 섞인 스트림처럼 전체를 메모리에 올릴 수 없을 때도 쓸 수 있습니다.
    maxScore: 10
  - promptMd: >-
      점근적으로 더 빠른 정렬이 있는데도 실제 표준 라이브러리가 작은 구간을 삽입 정렬로 처리하는 이유는 무엇인가요? 전환 기준 크기는 어떻게 정하겠습니까?
    hintKo: Big-O가 숨기는 상수와 하드웨어를 생각해 보세요.
    rubricKeywords: ["상수 계수", "캐시 지역성", "재귀·함수 호출 비용", "벤치마크로 결정", "Timsort 또는 introsort"]
    modelAnswerKo: |-
      Big-O는 $N$이 충분히 클 때의 증가율만 말합니다. 작은 $N$에서는 상수 계수가 지배합니다. 삽입 정렬은 재귀 호출, 피벗 선택, 보조 배열 할당이 없고 인접한 메모리를 순서대로 읽어 캐시와 분기 예측에 유리합니다. 또 일부가 정렬된 입력에서는 선형에 가깝습니다.

      그래서 Timsort는 짧은 run을 (이진) 삽입 정렬로 늘리고, introsort 구현은 작은 구간을 남겨 두었다가 삽입 정렬로 마무리합니다. 전환 크기는 보통 수십 개 이하인데 이론값이 아니라 원소 크기, 비교 비용, 캐시에 좌우되므로 대상 데이터와 하드웨어에서 벤치마크해 정합니다. 너무 크게 잡으면 구간마다 $O(m^2)$ 비용이 다시 커집니다.
    maxScore: 10
  - promptMd: >-
      삽입할 위치를 이진 탐색으로 찾으면 삽입 정렬이 $O(N \log N)$이 되나요? 이 변형은 언제 의미가 있나요?
    hintKo: 비교 횟수와 이동 횟수를 따로 세어 보세요.
    rubricKeywords: ["비교는 O(N log N)", "이동은 여전히 O(N^2)", "비교 비용이 클 때 유리", "안정성을 위해 upper bound 위치"]
    modelAnswerKo: |-
      아닙니다. 비교 횟수는 $O(N \log N)$으로 줄지만 배열에서는 삽입할 자리를 만들기 위해 원소를 밀어야 하므로 이동이 여전히 최악 $O(N^2)$입니다. 연결 리스트를 쓰면 이동은 없어지지만 임의 접근이 안 되어 이진 탐색의 이점이 사라집니다.

      이 변형은 긴 문자열이나 사용자 정의 비교 함수처럼 비교가 이동보다 훨씬 비쌀 때 의미가 있습니다. 대신 정렬된 입력에서도 비교를 $O(\log N)$번씩 하므로 최선이 $O(N)$이 아니게 됩니다. 안정성을 지키려면 같은 값들의 오른쪽 끝(upper bound)에 삽입해야 합니다.
    maxScore: 10

boost-algo-005:
  author: {model: claude-opus-5-5, at: 2026-11-25}
  replace:
  - old: |-
      return merge(leftList, rightList)
      ```
    new: |-
      return merge(leftList, rightList)

      def merge(left, right):
          merged = []
          i = j = 0
          while i < len(left) and j < len(right):
              if left[i] <= right[j]:  # 같으면 왼쪽을 먼저: 안정 정렬
                  merged.append(left[i])
                  i += 1
              else:
                  merged.append(right[j])
                  j += 1
          return merged + left[i:] + right[j:]
      ```
  append: |-
    - **복잡도 근거**: $T(N) = 2T(N/2) + O(N)$이므로 최선·평균·최악 모두 $O(N \log N)$이다. 보조 공간은 병합 배열 $O(N)$이고 재귀 스택은 $O(\log N)$이다.
    - **안정 정렬**: 병합할 때 값이 같으면 왼쪽 부분 배열의 원소를 먼저 넣기 때문이다. 비교를 `<`로 바꾸면 안정성이 깨진다.
    - **퀵 정렬과의 차이**: 퀵 정렬은 먼저 분할(partition)하면서 순서를 맞추고 재귀한다. 합병 정렬은 먼저 끝까지 쪼개고 합치면서(merge) 순서를 맞춘다.
    - **연결 리스트**: 병합은 앞에서부터 순차 접근만 하므로 연결 리스트에 알맞다. 노드의 링크만 바꾸면 되어 병합 배열도 필요 없다. 임의 접근에 기대는 배열용 퀵 정렬 구현을 그대로 쓰면 위치를 찾을 때마다 $O(N)$이 든다.
  followUps:
  - promptMd: >-
      메모리가 8GB인 장비에서 100GB 로그 파일을 시간순으로 정렬해야 합니다. 어떻게 설계하고, 성능을 좌우하는 것은 무엇인가요?
    hintKo: 메모리에 들어가는 만큼 먼저 정렬한 뒤, 여러 파일을 한 번에 합치는 방법을 생각해 보세요.
    rubricKeywords: ["외부 합병 정렬(external merge sort)", "정렬된 run 생성", "k-way merge", "최소 힙", "순차 I/O와 버퍼 크기"]
    modelAnswerKo: |-
      외부 합병 정렬을 씁니다. 먼저 메모리에 들어가는 크기(예: 6GB)씩 읽어 정렬하고 디스크에 run으로 씁니다. 약 17개의 run이 생깁니다. 다음으로 각 run에서 블록 단위로 읽으며 최소 힙으로 k-way merge를 해 한 번에 합칩니다. 힙에는 run마다 원소 하나만 두므로 비교는 원소당 $O(\log k)$입니다.

      성능은 비교 횟수보다 I/O가 좌우합니다. run마다 입력 버퍼를 크게 잡아 순차 읽기를 늘리고, 병합을 한 번의 pass로 끝낼 수 있는지 확인합니다. run이 너무 많아 버퍼가 작아지면 여러 pass로 나눕니다. 시간이 같은 로그의 원래 순서를 지키려면 힙의 키에 run 번호를 함께 넣어 안정성을 보장합니다.
    maxScore: 10
  - promptMd: >-
      합병 정렬의 안정성은 코드의 어느 부분에서 결정되나요? 안정성이 없으면 실제로 어떤 문제가 생기는지 예를 들어 설명하세요.
    hintKo: 두 값이 같을 때 어느 쪽을 먼저 꺼내나요?
    rubricKeywords: ["<= 비교로 왼쪽 우선", "동일 키의 원래 순서 유지", "여러 키 순차 정렬", "결과 재현성"]
    modelAnswerKo: |-
      병합에서 `left[i] <= right[j]`일 때 왼쪽을 먼저 꺼내는 비교입니다. `<`로 바꾸면 같은 값에서 오른쪽이 먼저 나와 원래 순서가 뒤집힙니다.

      안정성이 없으면 여러 키로 나누어 정렬할 때 문제가 됩니다. 예를 들어 날짜로 정렬한 뒤 사용자로 다시 정렬하면, 안정 정렬에서는 사용자 안에서 날짜 순서가 유지되지만 불안정 정렬에서는 깨집니다. 추천이나 검색에서 점수가 같은 항목의 순서가 구현에 따라 달라지면 오프라인 지표와 A/B 비교의 재현성도 떨어집니다. 불안정 정렬을 써야 한다면 원래 인덱스나 고유 ID를 보조 키로 넣어 동점을 명시적으로 처리합니다.
    maxScore: 10
  - promptMd: >-
      두 모델이 같은 항목들에 매긴 순위가 얼마나 다른지 보려고 순서가 뒤집힌 쌍(inversion)의 개수를 세려 합니다. 합병 정렬을 이용해 $O(N \log N)$에 구하는 방법을 설명하세요.
    hintKo: 병합 중에 오른쪽 원소를 먼저 꺼내는 순간, 왼쪽에 남은 원소들과의 관계를 보세요.
    rubricKeywords: ["오른쪽을 먼저 꺼낼 때 왼쪽에 남은 개수를 더함", "왼쪽·오른쪽·교차 역순쌍의 합", "O(N log N)", "Kendall tau"]
    modelAnswerKo: |-
      한 모델의 순위 순서로 항목을 놓고 다른 모델의 순위를 배열로 만듭니다. 이 배열의 역순쌍 개수가 두 순위가 어긋난 쌍의 수입니다.

      역순쌍은 왼쪽 절반 내부, 오른쪽 절반 내부, 두 절반에 걸친 쌍의 합입니다. 앞의 둘은 재귀로 구합니다. 걸친 쌍은 병합할 때 셉니다. 왼쪽과 오른쪽이 각각 정렬되어 있으므로 `left[i] > right[j]`라서 오른쪽을 꺼내는 순간 왼쪽에 남은 `len(left) - i`개가 모두 `right[j]`보다 큽니다. 그 수를 더합니다. 병합은 그대로 $O(N)$이므로 전체는 $O(N \log N)$입니다. 동점이 없을 때 Kendall tau는 $1 - 4I / (N(N-1))$로 바로 계산됩니다. 동점이 있으면 tau-b처럼 동점 보정이 필요합니다.
    maxScore: 10

boost-algo-006:
  author: {model: claude-opus-5-5, at: 2026-11-25}
  replace:
  - old: 모든 노드가 힙 속성(각 노드의 값이 자신의 자식 노드 값보다 큰 이진 트리)을
    new: 모든 노드가 최대 힙 속성(각 노드의 값이 자신의 자식 노드 값보다 크거나 같다)을
  append: |-
    - **불안정 정렬**: 루트를 배열 맨 끝과 바꾸는 먼 거리 교환에서 같은 값의 순서가 뒤집힐 수 있다.
    - **`n//2-1`부터 거꾸로 도는 이유**: 0부터 세면 `i`의 자식은 `2i+1`, `2i+2`이다. 따라서 `n//2` 이후의 노드는 모두 잎이라 이미 힙이고, 마지막 내부 노드가 `n//2-1`이다.
    - **두 번의 heapify**: 첫 번째 반복문은 배열 전체를 최대 힙으로 만든다. 두 번째 반복문은 최댓값을 꺼낸 뒤 줄어든 힙의 루트만 다시 내려보낸다.
    - **힙 구성은 $O(N)$**: 높이 $h$인 노드는 최대 $\lceil N/2^{h+1} \rceil$개이고 하나를 내려보내는 데 $O(h)$이므로 $\sum_h \frac{N}{2^{h+1}} O(h) = O(N)$이다. 이후 $N-1$번의 추출이 $O(N \log N)$을 차지한다.
    - **공간**: 보조 배열은 필요 없다. 위 코드는 재귀라 스택 $O(\log N)$을 쓰고, 반복문으로 바꾸면 $O(1)$이다.
    - **쓸모**: 최댓값·최솟값 또는 상위 $k$개만 필요할 때, 그리고 모든 원소가 제자리에서 $k$칸 이내일 때(크기 $k+1$ 최소 힙으로 $O(N \log k)$) 유용하다.
  followUps:
  - promptMd: >-
      원소 $N$개로 힙을 만드는 비용이 $O(N \log N)$이 아니라 $O(N)$인 이유를 증명하세요. 원소를 하나씩 삽입해 만들 때와 왜 다른가요?
    hintKo: 노드가 가장 많은 층에서 노드 하나가 하는 일의 양을 비교해 보세요.
    rubricKeywords: ["bottom-up heapify", "높이 h인 노드 수 N/2^(h+1)", "급수의 수렴", "삽입은 깊이만큼 올라가 최악 O(N log N)"]
    modelAnswerKo: |-
      아래에서 위로 heapify하면 높이 $h$인 노드는 최대 $\lceil N/2^{h+1} \rceil$개이고, 하나를 내려보내는 비용은 $O(h)$입니다. 총비용은 $\sum_{h=0}^{\log N} \frac{N}{2^{h+1}} O(h) = O(N \sum_h h/2^h)$이고 $\sum_h h/2^h = 2$로 수렴하므로 $O(N)$입니다.

      하나씩 삽입하면 노드가 깊이만큼 위로 올라갑니다. 노드의 절반이 깊이 약 $\log N$인 마지막 층에 있으므로 최악에는 대부분이 $\log N$만큼 움직여 $O(N \log N)$이 됩니다. 즉 bottom-up 방식은 노드가 많은 층이 적게 움직이고, 삽입 방식은 노드가 많은 층이 많이 움직입니다.
    maxScore: 10
  - promptMd: >-
      추천 후보 1억 개의 점수가 스트림으로 들어올 때 상위 100개를 구해야 합니다. 자료구조를 고르고, 전체 정렬이나 quickselect와 비교하세요. 여러 서버에 나뉘어 있다면 어떻게 합치겠습니까?
    hintKo: 지금까지의 상위 100개 중 가장 작은 값과만 비교하면 됩니다.
    rubricKeywords: ["크기 k 최소 힙", "O(N log k) 시간, O(k) 공간", "quickselect 평균 O(N)이지만 전체 적재 필요", "샤드별 top-k 후 병합"]
    modelAnswerKo: |-
      크기 100의 **최소 힙**을 유지합니다. 새 점수가 루트(현재 상위 100개 중 최솟값)보다 크면 루트를 교체합니다. 시간은 최악 $O(N \log k)$, 공간은 $O(k)$입니다. 순서가 무작위라면 대부분의 원소는 루트와 한 번 비교하고 버려지므로 실제 비용은 $O(N)$에 가깝습니다.

      전체 정렬은 $O(N \log N)$이고 모두 저장해야 합니다. quickselect는 평균 $O(N)$이지만 전체를 메모리에 두고 위치를 바꿔야 해서 스트림에 맞지 않습니다. 대신 점수가 이미 배열이나 GPU에 있으면 partition 기반 top-k가 유리합니다.

