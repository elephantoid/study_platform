  - promptMd: >-
      Kruskal 알고리즘을 중간에 멈추면 데이터 군집화에 쓸 수 있습니다. 어떤 군집화 방법과 같고, 장단점은 무엇인가요?
    hintKo: 연결 요소가 k개 남았을 때 멈추면 무엇이 최대가 되나요?
    rubricKeywords: ["단일 연결(single linkage) 계층 군집화", "연결 요소 k개에서 중단", "군집 간 최소 거리(spacing) 최대화", "사슬 효과(chaining)와 이상치에 약함", "모든 쌍 거리 O(N^2)"]
    modelAnswerKo: |-
      점을 정점, 거리를 간선 가중치로 두고 연결 요소가 $k$개 남았을 때 멈추면 단일 연결(single-linkage) 계층 군집화의 결과와 같습니다. 이는 MST에서 가장 긴 간선 $k-1$개를 지운 것과 같고, 서로 다른 군집 사이의 최소 거리(spacing)를 최대화합니다.

      장점은 군집의 모양을 가정하지 않아 길거나 휘어진 군집을 찾을 수 있고, 한 번의 계산으로 모든 $k$의 계층을 얻는다는 점입니다. 단점은 사슬 효과입니다. 군집 사이에 잡음 점이 몇 개만 있어도 서로 이어집니다. 이상치는 혼자 남는 군집이 되기도 합니다. 또 모든 쌍 거리가 $O(N^2)$이라 큰 데이터에서는 근사 최근접 이웃 그래프 위에서 계산합니다. HDBSCAN은 밀도로 보정한 거리에서 MST를 만들어 이 잡음 문제를 줄입니다.
