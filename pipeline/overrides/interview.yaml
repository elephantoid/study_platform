    rubricKeywords: ["고정 pivot은 정렬 입력에서 O(N^2)", "median-of-three도 공격 입력 존재", "난수 pivot은 기대 O(N log N)", "introsort는 최악 O(N log N) 보장", "재귀 깊이와 스택"]
    modelAnswerKo: |-
