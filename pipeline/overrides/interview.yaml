    modelAnswerKo: |-
      지금까지 고른 간선 집합 $A$가 어떤 MST $T$에 포함된다고 가정하고(처음에는 공집합), 다음으로 고른 간선 $e=(u,v)$를 더해도 어떤 MST에 포함됨을 보입니다. $u$가 속한 연결 요소를 $S$라 하면 $e$는 $S$와 나머지를 잇는 간선 중 가중치가 가장 작습니다. 더 작은 교차 간선이 있었다면 그것은 사이클을 만들지 않으므로 먼저 골랐을 것이기 때문입니다.

      $e \in T$이면 끝입니다. 아니면 $T \cup \{e\}$에 사이클이 생기고, 그 사이클은 $S$ 밖으로 나갔다 돌아오므로 다른 교차 간선 $f$를 포함합니다. $f$는 $A$의 간선이 아니고 $w(e) \le w(f)$입니다. $T' = T - f + e$는 신장 트리이고 비용이 $T$보다 크지 않으므로 역시 MST이며 $A \cup \{e\}$를 포함합니다. 귀납법으로 마지막에 얻은 트리는 MST입니다.
