  - promptMd: >-
      32비트 부호 없는 정수 1천만 개를 LSD 기수 정렬로 정렬합니다. 진법 $b$를 $2^8$로 할지 $2^{16}$으로 할지 어떻게 정하겠습니까?
    hintKo: pass 수와 카운트 배열의 크기가 서로 반대로 움직입니다.
    rubricKeywords: ["pass 수 d = ceil(32/r)", "O(d(N+b))", "카운트 배열과 캐시·TLB", "벤치마크"]
    modelAnswerKo: |-
      한 자리를 $r$비트로 하면 $b = 2^r$이고 pass 수는 $\lceil 32/r \rceil$, 비용은 $O(\lceil 32/r \rceil (N + 2^r))$입니다. $r=8$이면 4번의 pass에 카운트 256칸, $r=16$이면 2번의 pass에 카운트 65,536칸입니다. $N=10^7$에서는 두 경우 모두 $b \ll N$이라 식만 보면 $r=16$이 유리합니다.

      하지만 실제로는 메모리가 좌우합니다. 카운트 65,536칸은 4바이트 기준 256KB로 L1 캐시를 넘고, 결과를 65,536개의 위치에 흩어 쓰면 캐시와 TLB 미스가 늘어납니다. 256개의 쓰기 위치는 그 부담이 훨씬 작습니다. 그래서 흔히 8비트나 11비트(3번의 pass)를 고르고, 쓰기 버퍼 같은 최적화 여부까지 포함해 대상 하드웨어에서 벤치마크해 정합니다.
