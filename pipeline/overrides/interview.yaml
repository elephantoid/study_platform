boost-algo-022:
  author: {model: claude-opus-5-5, at: 2026-11-25}
  append: |-
    ```python
    class UnionFind:
        def __init__(self, n):
            self.parent = list(range(n))
            self.size = [1] * n
            self.count = n              # 집합의 개수

        def find(self, x):
            root = x
            while self.parent[root] != root:
                root = self.parent[root]
            while self.parent[x] != root:   # 경로 압축: 지나온 노드를 루트에 직접 연결
                self.parent[x], x = root, self.parent[x]
            return root

        def union(self, a, b):
            a, b = self.find(a), self.find(b)
            if a == b:
                return False            # 이미 같은 집합 (무방향 그래프라면 사이클)
            if self.size[a] < self.size[b]:
                a, b = b, a
            self.parent[b] = a          # 작은 쪽을 큰 쪽에 붙인다
            self.size[a] += self.size[b]
            self.count -= 1
            return True
    ```

    - **복잡도**: 아무 최적화가 없으면 트리가 한 줄로 길어져 한 연산이 $O(N)$이다. 크기(또는 랭크) 기준 합치기만으로 $O(\log N)$, 경로 압축까지 쓰면 연산 $M$번에 $O((M + N)\,\alpha(N))$이다. $\alpha$(역 아커만 함수)는 현실적인 $N$에서 4 이하라 사실상 상수이다.
    - `find`를 반복문으로 쓰면 긴 트리에서도 재귀 한도에 걸리지 않는다.
  followUps:
  - promptMd: >-
      경로 압축과 크기(랭크) 기준 합치기는 각각 무엇을 막아 주나요? 하나만 쓸 때와 둘 다 쓸 때의 복잡도를 비교하세요.
    hintKo: 최악의 입력에서 트리가 어떤 모양이 되는지 그려 보세요.
    rubricKeywords: ["최적화 없음 O(N)", "크기 기준은 높이를 O(log N)으로 제한", "경로 압축만 쓰면 분할 상환 O(log N)", "둘 다 쓰면 α(N)", "분할 상환"]
    modelAnswerKo: |-
      최적화가 없으면 긴 쪽을 짧은 쪽 아래에 계속 붙여 한 줄 트리가 되고 `find`가 $O(N)$입니다. 크기나 랭크 기준 합치기는 애초에 트리가 높아지는 것을 막습니다. 노드의 깊이가 1 늘 때마다 속한 집합의 크기가 두 배 이상이 되므로 높이가 $O(\log N)$이고, 이는 **최악** 보장입니다. 경로 압축은 한 번 지나간 경로를 납작하게 만들어 이후 연산을 빠르게 합니다. 이것만 쓰면 한 연산의 최악은 $O(N)$일 수 있지만 분할 상환으로 $O(\log N)$입니다.

      둘을 함께 쓰면 분할 상환 $O(\alpha(N))$으로 사실상 상수입니다. 다만 개별 연산은 여전히 $O(\log N)$일 수 있습니다. 합치기를 되돌려야 하는 문제(오프라인 동적 연결성 등)에서는 경로 압축이 되돌리기를 어렵게 하므로 크기 기준 합치기만 씁니다.
    maxScore: 10
  - promptMd: >-
      방향 그래프의 사이클을 Union-find로 검출할 수 없는 이유를 반례로 설명하고, 올바른 방법을 제시하세요.
    hintKo: 간선의 방향을 잊으면 어떤 DAG가 사이클로 보이나요?
    rubricKeywords: ["연결성만 보고 방향을 잃음", "다이아몬드 DAG 반례", "DFS 3색(back edge)", "Kahn 알고리즘"]
    modelAnswerKo: |-
      Union-find는 두 정점이 같은 집합인지만 알 뿐 간선의 방향을 저장하지 않습니다. $a \to b$, $a \to c$, $b \to d$, $c \to d$인 다이아몬드는 DAG이지만, 마지막 간선을 처리할 때 $c$와 $d$가 이미 같은 집합이라 사이클로 오판합니다.

      방향 그래프에서는 DFS로 정점을 미방문, 탐색 중, 완료의 세 상태로 나누고 **탐색 중**인 정점으로 가는 간선(back edge)이 있으면 사이클로 판단합니다. 완료된 정점으로 가는 간선은 사이클이 아닙니다. 또는 Kahn의 위상 정렬을 돌려 꺼낸 정점 수가 $V$보다 적으면 사이클이 있습니다. 둘 다 $O(V+E)$입니다. 실제 사이클의 경로를 보여 줘야 하면 DFS에서 부모를 기록해 되짚습니다.
    maxScore: 10
  - promptMd: >-
      LLM 학습 데이터에서 거의 같은 문서를 제거하려고 MinHash LSH로 유사한 문서 쌍을 찾았습니다. Union-find로 중복 묶음을 만들 때의 장점과 위험, 그리고 문서가 수십억 개일 때의 처리 방법을 설명하세요.
    hintKo: 유사도는 추이적인가요?
    rubricKeywords: ["연결 요소로 중복 묶음", "대표 문서 하나만 유지", "유사도는 추이적이지 않음 → 과잉 병합", "대표와의 유사도 재확인·묶음 크기 상한", "분산 연결 요소(라벨 전파 등)"]
    modelAnswerKo: |-
      유사한 쌍을 간선으로 보고 합치면 연결 요소가 중복 묶음이 됩니다. 간선을 한 번씩 흘려 보내며 거의 상수 시간에 처리하고 쌍의 순서에 무관하며, 묶음마다 대표 하나만 남기면 됩니다.

      위험은 유사도가 추이적이지 않다는 점입니다. A와 B, B와 C가 비슷해도 A와 C는 다를 수 있어, 흔한 상용구를 매개로 거대한 묶음이 생기고 다양한 문서가 지워질 수 있습니다. LSH의 거짓 양성이 이를 더 키웁니다. 그래서 후보 쌍의 실제 Jaccard 유사도를 확인한 뒤에만 합치고, 묶음 크기 분포를 살피며, 대표와의 유사도가 기준 이상인 문서만 제거합니다.

      한 대에 부모 배열이 들어가면(수십억 개 × 8바이트 = 수십 GB) 단일 노드 Union-find가 오히려 단순하고 빠릅니다. 그보다 크면 파티션별로 Union-find를 돌려 간선을 줄인 뒤 합치거나, 최소 라벨 전파와 pointer jumping을 쓰는 분산 연결 요소 알고리즘을 씁니다.
    maxScore: 10

boost-algo-023:
  author: {model: claude-opus-5-5, at: 2026-11-25}
  replace:
  - old: <u><strong>방향 그래프</strong>의 모든 노드를 선행 순서를 지키며 정점을 순서대로 나열하는 것</u>
    new: <u><strong>사이클이 없는 방향 그래프(DAG)</strong>의 모든 노드를 선행 순서를 지키며 순서대로 나열하는 것</u>
  - old: "**💡 진입 차수(degree)**"
    new: "**💡 진입 차수(in-degree)**"
  - old: 들어오는 간선의 개수를 진입 차수(degree)라고 한다.
    new: 들어오는 간선의 개수를 진입 차수(in-degree)라고 한다.
  append: |-
    - **전제**: DAG(Directed Acyclic Graph)에서만 존재한다. 사이클 위의 노드들은 서로가 서로보다 앞서야 하므로 순서를 정할 수 없다.
    - **시간 복잡도**: $O(V + E)$. 진입 차수를 구하고, 각 노드를 큐에 한 번 넣고 빼며, 각 간선을 한 번 제거한다. 공간도 (그래프를 제외하고) $O(V)$이다.
    - **유일하지 않다**: 큐에 노드가 둘 이상 있는 순간이 있으면 어느 것을 먼저 꺼내도 되므로 결과가 여러 개일 수 있다.
    - **다른 방법**: DFS의 종료 순서를 뒤집어도 위상 순서가 된다. 이때 탐색 중인 노드로 가는 간선(back edge)이 있으면 사이클이다.

    ```python
    from collections import deque

    def topological_sort(graph):        # graph[v]: v 다음에 와야 하는 노드들, 노드 0..n-1
        n = len(graph)
        indegree = [0] * n
        for v in range(n):
            for w in graph[v]:
                indegree[w] += 1

        q = deque(v for v in range(n) if indegree[v] == 0)
        order = []
        while q:
            v = q.popleft()
            order.append(v)
            for w in graph[v]:
                indegree[w] -= 1
                if indegree[w] == 0:
                    q.append(w)

        if len(order) < n:              # 남은 노드는 사이클에 있거나 사이클 뒤에 있다
            raise ValueError("사이클이 있어 위상 정렬할 수 없다")
        return order
    ```
  followUps:
  - promptMd: >-
      위상 정렬의 결과가 유일할 조건은 무엇이고 어떻게 확인하나요? 가능한 순서 중 사전순으로 가장 앞선 것을 구하려면 무엇을 바꿔야 하나요?
    hintKo: 큐에 노드가 두 개 이상 들어 있는 순간이 무엇을 뜻하는지 생각해 보세요.
    rubricKeywords: ["큐의 크기가 항상 1", "인접한 노드 사이에 모두 간선(해밀턴 경로)", "최소 힙", "O(E + V log V)"]
    modelAnswerKo: |-
      Kahn 알고리즘을 도는 동안 꺼내기 직전의 큐 크기가 항상 1이면 유일합니다. 두 개 이상이면 그 노드들 사이에 선후 관계가 없어 순서를 바꿔도 됩니다. 같은 말로, 결과에서 이웃한 모든 쌍 사이에 간선이 있어 모든 노드를 지나는 해밀턴 경로가 존재할 때 유일합니다. 이렇게 하면 결과 하나를 구한 뒤 $O(V+E)$에 확인할 수 있습니다.

      사전순으로 가장 앞선 결과는 큐 대신 최소 힙을 쓰고 진입 차수가 0인 노드 중 가장 작은 것을 매번 꺼내면 됩니다. 비용은 $O(E + V \log V)$입니다. 빌드나 데이터 파이프라인에서는 이렇게 동점을 명시적으로 처리해야 실행 순서가 재현됩니다.
    maxScore: 10
  - promptMd: >-
      딥러닝 프레임워크의 역전파에서 위상 정렬이 하는 역할을 설명하세요. 순서를 지키지 않으면 어떤 오류가 생기나요?
    hintKo: 한 중간 값이 여러 연산의 입력으로 쓰이는 경우를 생각해 보세요.
    rubricKeywords: ["계산 그래프는 DAG", "역위상 순서로 기울기 전파", "여러 소비자의 기울기 합산", "모두 모인 뒤 전파", "의존성 카운트"]
    modelAnswerKo: |-
      순전파는 연산을 노드로, 텐서의 의존 관계를 간선으로 하는 DAG를 만듭니다. 역전파는 손실에서 시작해 그 **역위상 순서**로 노드를 처리합니다. 어떤 값이 여러 연산에 쓰이면(잔차 연결, 가중치 공유) 그 값의 기울기는 모든 소비 연산에서 온 기울기의 합입니다. 역위상 순서를 지키면 노드를 처리할 때 모든 소비 연산이 이미 끝나 합이 완성되어 있습니다.

      순서를 지키지 않으면 일부 경로의 기울기만 더해진 상태로 아래로 전파해 **틀린 기울기**가 되거나, 이를 고치려고 경로마다 다시 전파하면 경로 수가 지수적으로 늘어날 수 있습니다. 엔진은 보통 노드별로 아직 도착하지 않은 기울기의 수를 세고 0이 되면 실행하는데, 이것이 Kahn 알고리즘과 같습니다. 깊은 그래프에서는 재귀 DFS 대신 이런 반복 방식을 써야 재귀 한도에 걸리지 않습니다.
    maxScore: 10
  - promptMd: >-
      에이전트가 세운 계획이 도구 호출들의 의존 관계로 주어졌습니다. 최대한 병렬로 실행하고, 전체 소요 시간을 예측하며, 잘못된 계획(사이클)을 사용자에게 설명하려면 어떻게 하겠습니까?
    hintKo: 지금 진입 차수가 0인 노드들은 서로 어떤 관계인가요?
    rubricKeywords: ["진입 차수 0인 작업을 동시에 실행", "완료될 때마다 진입 차수 감소", "임계 경로(최장 경로) DP", "DFS로 사이클 경로 복원", "동시 실행 수 제한·실패 전파"]
    modelAnswerKo: |-
      Kahn 알고리즘을 실행기로 씁니다. 진입 차수가 0인 작업들은 서로 의존하지 않으므로 동시에 실행하고, 하나가 끝날 때마다 후속 작업의 진입 차수를 줄여 0이 되면 바로 시작합니다. 층마다 모두 끝나기를 기다리는 방식보다 느린 작업 하나가 무관한 작업을 막지 않습니다.

      병렬 자원이 무한하다면 전체 시간의 하한은 임계 경로의 길이입니다. 위상 순서로 $finish[v] = t_v + \max_{(u,v)} finish[u]$를 계산해 $O(V+E)$에 구합니다. 동시 실행 수가 제한되면 이는 하한일 뿐이고 최적 스케줄링은 일반적으로 NP-hard라 임계 경로가 긴 작업부터 실행하는 휴리스틱을 씁니다.

      꺼낸 작업 수가 전체보다 적으면 사이클이 있습니다. 남은 노드에는 사이클 뒤에 매달린 작업도 섞여 있으므로, 남은 부분에서 DFS로 back edge를 찾아 실제 사이클 경로를 보여 주고 계획을 다시 세우게 합니다. 실패한 작업의 후속 작업은 취소하고, 부작용이 있는 호출은 재시도해도 안전하도록 만듭니다.
