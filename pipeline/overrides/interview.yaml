    new: |-
      ```python
      import heapq
      import sys
      input = sys.stdin.readline
      INF = float("inf")

      # 노드 개수, 간선 개수 입력받기
      n, m = map(int, input().split())
      # 시작 노드 번호 입력받기
      start = int(input())
      # 각 노드에 연결되어 있는 노드에 대한 정보를 담는 리스트 만들기
      graph = [[] for i in range(n+1)]
      # 최단 거리 테이블을 모두 무한으로 초기화
      distance = [INF] * (n+1)

      # 모든 간선 정보 입력받기
      for _ in range(m):
          a, b, c = map(int, input().split())
          # a 번 노드에서 b 번 노드로 가는 비용이 c 라는 의미
          graph[a].append((b, c))

      def dijkstra(start):
          q = []
          # 시작 노드로 가기 위한 최단 경로는 0 으로 설정하여, 큐에 삽입
          heapq.heappush(q, (0, start))
          distance[start] = 0
          while q: # 큐가 비어있지 않다면
              # 가장 최단 거리가 짧은 노드에 대한 정보 꺼내기
              dist, now = heapq.heappop(q)
              # 현재 노드가 이미 처리된 적이 있는 노드면 무시
              if distance[now] < dist:
                  continue
              # 현재 노드와 연결된 다른 인접한 노드들을 확인
              for to_other in graph[now]:
                  cost = dist + to_other[1]
                  if distance[to_other[0]] > cost:
                      distance[to_other[0]] = cost
                      heapq.heappush(q, (cost, to_other[0]))

      # 다익스트라 알고리즘 수행
      dijkstra(start)

      # 모든 노드로 가기 위한 최단 거리를 출력
      for i in range(1, n+1):
          # 도달할 수 없는 경우, 무한으로 출력
          if distance[i] == INF:
              print("INFINITY")
          else:
              print(distance[i])
      ```

