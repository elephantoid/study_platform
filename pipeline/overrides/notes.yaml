gyoogle-os-015:
  replace:
  - old: "뮤텍스는 상태가 0, 1로 **이진 세마포어**로 부르기도 함"
    new: "뮤텍스는 상태가 0, 1이라는 점에서 **이진 세마포어**와 비슷하지만, lock을 얻은 스레드만 unlock할 수 있다는 소유권 차이가 있음"
  - old: "   }\n   \n   // ------- 임계 구역 ---------\n   \n   turn = j; // 임계 구역 사용 끝나면 turn을 넘김\n   flag[i] = false; // flag 값을 false로 바꿔 임계 구역 사용 완료를 알림"
    new: "   \n       // ------- 임계 구역 ---------\n   \n       turn = j; // 임계 구역 사용 끝나면 turn을 넘김\n       flag[i] = false; // flag 값을 false로 바꿔 임계 구역 사용 완료를 알림\n   }"
  - old: "   }\n   \n   // ------- 임계 구역 ---------\n   \n   flag[i] = false; // flag 값을 false로 바꿔 임계 구역 사용 완료를 알림"
    new: "   \n       // ------- 임계 구역 ---------\n   \n       flag[i] = false; // flag 값을 false로 바꿔 임계 구역 사용 완료를 알림\n   }"
  - old: "while(number[j] && number[j] < number[i] && j < i);"
    new: "while(number[j] && (number[j] < number[i] || (number[j] == number[i] && j < i)));"
jbee-algo-001:
  author: {model: claude-opus-5-5, at: 2026-11-25}
  replace:
  - old: 계속해서 바꾸는 것이 아니라 비교하고 있는 값의 index 를 저장해둔다. 그리고 최종적으로 한 번만 바꿔준다.
    new: 계속해서 바꾸는 것이 아니라 정렬되지 않은 구간에서 가장 작은(또는 큰) 값의 index 를 저장해둔다. 그리고 회전마다 마지막에 한 번만 바꿔준다.
  - old: 결국 하나씩 남을 때까지 분할하는 것이면, 바로 하나씩 분할해버리면 되지 않을까? 재귀적으로 정렬하는 원리인 것이다. 재귀적 구현을 위해 1/2 씩 분할한다.
    new: 결국 하나씩 남을 때까지 분할하는 것이면, 바로 하나씩 분할해버리면 되지 않을까? 가능하다. 길이 1인 구간부터 둘씩 합쳐 올라가는 bottom-up 방식이다. 재귀로 구현하는 top-down 방식에서는 1/2 씩 분할한다.
  - old: 하나의 기수마다 하나의 버킷을 생성하여, 분류를 한 뒤에, 버킷 안에서 또 정렬을 하는 방식이다.
    new: 하나의 기수마다 하나의 버킷을 생성하여 분류한다. 그 뒤 LSD 는 버킷을 순서대로 다시 모아 전체를 다음 자리로 분류하기를 반복하고, MSD 는 버킷 안에서 다음 자리로 재귀한다.
  - old: 두 가지 방식의 Big-O 는 동일하다. 하지만 주로 기수정렬을 이야기할 때는
    new: LSD 의 시간은 O(d(n + b))이다. MSD 는 작은 버킷마다 b 칸의 카운트를 훑으면 이보다 느려질 수 있어 작은 버킷은 다른 정렬로 처리한다. 주로 기수정렬을 이야기할 때는
  - old: 하지만 정렬이 완료됬는지 확인하는 과정이 필요하고 이 때문에 메모리를 더 사용하게 된다.
    new: 하지만 재귀 깊이마다 버킷의 구간 정보를 유지해야 하므로 메모리를 더 사용하게 된다.
  - old: |-
      |       O(log(n))       |    O(nlogn)     |
    new: |-
      | O(log n), 최악 O(n) (작은 쪽만 재귀하면 최악도 O(log n)) |    O(nlogn)     |
  - old: i 번째 원소가 비교하는 원소보다 클 경우 서로의 위치를 바꾸고, 작을 경우 위치를 바꾸지 않고 다음 순서의 원소와 비교하면서 정렬해준다.
    new: i 번째 원소가 비교하는 원소보다 작으면 서로의 위치를 바꾸고 계속 앞의 원소와 비교하며, 크거나 같으면 자리를 찾은 것이므로 멈춘다.
  - old: 때문에 힙 자료구조를 사용하여 Sorting 을 하는데 time complexity 는 `O(log n)`이 된다. 이 정렬을 하려는 대상이 n 개라면 time complexity 는 `O(nlogn)`이 된다.
    new: 때문에 정렬하려는 대상이 n 개라면 삽입·삭제를 n 번씩 하므로 time complexity 는 `O(nlogn)`이 된다. (기존 배열을 heapify 하는 방법은 힙을 만드는 데 `O(n)`, 꺼내는 데 `O(nlogn)`이다.)
  - old: 첫번째 원소부터 비교하는데 만약 그 값이 pivot 보다 작다면 그대로 두고 크다면 맨 마지막에서 그 앞의 원소와 자리를 바꿔준다. 즉 pivot value 의 index 가 k 라면 k-1 번째와 바꿔주는 것이다. 이 모든 원소에 대해 실행하고 마지막 과정에서 작은 값들이 채워지는 인덱스를 가리키고 있는 값에 1 을 더한 index 값과 pivot 값을 바꿔준다. 즉, 최종적으로 결정될 pivot 의 인덱스를 i 라고 했을 때, 0 부터 i-1 까지는 pivot 보다 작은 값이 될 것이고 i+1 부터 k 까지는 pivot 값보다 큰 값이 될 것이다.
    new: 첫번째 원소부터 차례로 pivot 과 비교하면서, pivot 보다 작은 값을 만나면 '작은 값들이 채워진 구간'의 바로 다음 원소와 자리를 바꾸고 그 구간을 한 칸 늘린다. 크거나 같은 값은 그대로 둔다. pivot 을 뺀 모든 원소에 대해 실행한 뒤 작은 값 구간의 바로 다음 원소와 pivot 을 바꿔준다(Lomuto 방식). 즉, 최종적으로 결정될 pivot 의 인덱스를 i, pivot 이 처음 있던 마지막 인덱스를 k 라고 했을 때, 0 부터 i-1 까지는 pivot 보다 작은 값이 될 것이고 i+1 부터 k 까지는 pivot 값보다 크거나 같은 값이 될 것이다.
  - old: "**최대값에 해당하는 값을 size 로 하는 임시 배열** 을"
    new: "**최대값 + 1 을 size 로 하는 임시 배열** 을"
  - old: 큰 값부터 즉 큰 index 부터 시작하여 누적된 값으로
    new: 작은 값부터 즉 작은 index 부터 시작하여 누적된 값으로
  - old: |-
      누적된 값은 정렬하고자 하는 값들이 정렬될 index 값을 나타내게 된다. 작업을 마친 임시 배열의 index 는 정렬하고자 하는 값을 나타내고 value 는 정렬하고자 하는 값들이 정렬되었을 때의 index 를 나타내게 된다. 이를 기준으로 정렬을 해준다. 점수와 같이 0~100 으로 구성되는 좁은 범위에 존재하는 데이터들을 정렬할 때 유용하게 사용할 수 있다.

      | Space Complexity | Time Complexity |
      | :--------------: | :-------------: |
      |       O(n)       |      O(n)       |
    new: |-
      누적된 값은 그 값 이하인 원소의 개수, 즉 같은 값들이 놓일 마지막 자리 다음의 index 를 나타내게 된다. 입력을 뒤에서부터 읽으면서 누적된 값을 1 줄이고 그 자리에 원소를 놓으면 정렬되며 안정성도 유지된다. 점수와 같이 0~100 으로 구성되는 좁은 범위에 존재하는 데이터들을 정렬할 때 유용하게 사용할 수 있다. (k 는 값의 범위 크기)

      | Space Complexity | Time Complexity |
      | :--------------: | :-------------: |
      |     O(n + k)     |    O(n + k)     |
  - old: 정렬 알고리즘의 한계는 O(n log n)이지만, 기수 정렬은 이 한계를 넘어설 수 있는 알고리즘이다. 단, 한 가지 단점이 존재하는데 적용할 수 있는 범위가 제한적이라는 것이다. 이 범위는 **데이터 길이** 에 의존하게 된다. 정렬하고자 하는 데이터의 길이가 동일하지 않은 데이터에 대해서는 정렬이 불가능하다. 숫자말고 문자열의 경우도 마찬가지이다. (불가능하다는 것은 기존의 정렬 알고리즘에 비해 기수 정렬 알고리즘으로는 좋은 성능을 내는데 불가능하다는 것이다.)
    new: 비교 기반 정렬의 하한은 Ω(n log n)이지만, 기수 정렬은 비교하지 않으므로 이 하한에 걸리지 않는다. 단, 한 가지 단점이 존재하는데 자릿수로 나눌 수 있는 키에만 적용할 수 있고 비용이 **데이터 길이**(자릿수)에 의존한다는 것이다. 길이가 다른 데이터도 짧은 쪽을 채우거나(숫자는 앞에 0) 길이별로 나누면 정렬할 수 있지만, 일부 데이터만 아주 길면 좋은 성능을 내기 어렵다. 문자열의 경우도 마찬가지이다.
  - old: |-
      이러한 이유들로 기수 정렬을 논할 때는 주로 LSD 에 대해서 논한다.

      | Space Complexity | Time Complexity |
      | :--------------: | :-------------: |
      |       O(n)       |      O(n)       |
    new: |-
      이러한 이유들로 기수 정렬을 논할 때는 주로 LSD 에 대해서 논한다. (d 는 자릿수, b 는 기수의 크기)

      | Space Complexity | Time Complexity |
      | :--------------: | :-------------: |
      |     O(n + b)     |   O(d(n + b))   |
  - old: |-
      |   Quick sort   |       O(1)       |         O(nlogn)          |         O(n^2)          |
      |   Count sort   |       O(n)       |           O(n)            |          O(n)           |
      |   Radix sort   |       O(n)       |           O(n)            |          O(n)           |
    new: |-
      |   Quick sort   | O(log n), 최악 O(n) |         O(nlogn)          |         O(n^2)          |
      |   Count sort   |     O(n + k)     |         O(n + k)          |        O(n + k)         |
      |   Radix sort   |     O(n + b)     |        O(d(n + b))        |       O(d(n + b))       |
  append: |-
    **안정성 비교**

    같은 키를 가진 원소들의 원래 순서가 정렬 뒤에도 유지되면 안정 정렬이다.

    | 정렬 | 안정 | 최선 | 이유 |
    | --- | :---: | --- | --- |
    | Bubble | O | $O(n)$ (교환이 없으면 멈출 때) | 이웃한 두 원소가 뒤집혔을 때만 바꾼다 |
    | Selection | X | $O(n^2)$ | 멀리 떨어진 원소와 바꾼다. 예: `2a 2b 1` → `1 2b 2a` |
    | Insertion | O | $O(n)$ | 앞의 값이 더 클 때만 민다 |
    | Merge | O | $O(n \log n)$ | 같으면 왼쪽을 먼저 꺼낸다 |
    | Heap | X | $O(n \log n)$ (값이 서로 다를 때) | 루트와 맨 끝을 바꾼다 |
    | Quick | X | $O(n \log n)$ | 분할에서 먼 거리를 바꾼다 |
    | Counting | O | $O(n + k)$ | 뒤에서부터 읽어 마지막 자리부터 채운다 |
    | Radix (LSD) | O | $O(d(n + b))$ | 자릿수별 안정 정렬을 반복한다 |

    안정성이 필요한 경우: 여러 키로 나누어 차례로 정렬할 때, 동점의 순서가 재현되어야 할 때, 기수 정렬의 내부 정렬. 불안정 정렬에서도 (키, 원래 인덱스)를 비교하면 안정하게 만들 수 있지만 $O(n)$의 공간이 더 든다. 흔히 쓰는 알고리즘은 안정성, $O(1)$ 공간, 최악 $O(n \log n)$ 중 하나 이상을 포기한다(모두 만족하는 block merge sort도 있으나 구현이 복잡하다).
