[project]
name = "study-pipeline"
version = "0.1.0"
description = "Ingest pipeline for the study platform (deterministic, no LLM)"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "yt-dlp>=2026.10.26",
]

[project.scripts]
ingest = "study_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
