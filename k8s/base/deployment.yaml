apiVersion: apps/v1
kind: Deployment
metadata:
  name: study-platform-web
  labels:
    app.kubernetes.io/name: study-platform-web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: study-platform-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: study-platform-web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/elephantoid/study_platform-web # 태그는 overlay 가 정한다
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: study-platform-web
            - secretRef:
                name: study-platform-web
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          # 프로세스가 죽었는지만 본다. 나중에 DB 가 붙어도 DB 장애로 재시작되지 않는다.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
