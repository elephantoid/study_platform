apiVersion: apps/v1
kind: Deployment
metadata:
  name: study-platform-web
  labels:
    app.kubernetes.io/name: study-platform-web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: study-platform-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: study-platform-web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # server 가 Ready(/api/health 200, 콘텐츠 검증 통과)가 된 뒤에 web 을 시작한다.
      # 같은 web 이미지(alpine busybox wget)를 쓰므로 이미지를 하나 더 받지 않는다.
      initContainers:
        - name: wait-for-api
          image: ghcr.io/elephantoid/study_platform-web # 태그는 overlay 가 정한다
          command:
            - sh
            - -c
            - until wget -q -T 3 -O /dev/null "$STUDY_API_URL/api/health"; do echo "waiting for $STUDY_API_URL"; sleep 2; done
          envFrom:
            - configMapRef:
                name: study-platform-web
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: web
          image: ghcr.io/elephantoid/study_platform-web # 태그는 overlay 가 정한다
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: study-platform-web
            - secretRef:
                name: study-platform-web
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # `/` 는 정적 페이지라 API 장애와 무관하다. API 가 죽으면 카드 페이지만 500 이 되고 강의·대시보드는 남는다.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          # 프로세스가 죽었는지만 본다. 나중에 DB 가 붙어도 DB 장애로 재시작되지 않는다.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
