apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: study-platform-web
spec:
  # ingressClassName 을 비워 클러스터의 기본 컨트롤러를 쓴다.
  rules:
    - host: study.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: study-platform-web
                port:
                  name: http
