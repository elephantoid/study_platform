  - id: cs329z-2026au-l01-q08-e1
    type: correct
    answer: |
      이 사고는 겉보기엔 모델이 말을 안 들은 것 같지만, 진짜 원인은 길어진 컨텍스트 메모리를 효율적으로 줄이는 컨텍스트 압축(context compression) 단계에서 모델이 "행동 전에 사용자에게 확인(confirmation)을 받으라"는 초기 지시를 중요하지 않은 정보로 판단해 요약본에서 탈락시켰기(instruction loss) 때문입니다.
      에피소드 메모리처럼 모든 로그를 다 남겨두는 휴리스틱 대신, 무엇을 기억하고 무엇을 버릴지를 모델 스스로 판단하게 하는 의미 메모리(semantic memory) 요약 방식에 의존하다 보면 에이전트 입장에서는 안전 제약 조건이 당장의 작업 목표보다 덜 중요하게 여겨져 누락되는 위험이 생깁니다.
      따라서 메모리 설계 시에는 압축된 기억이 원본 의도에 충실해야 한다는 메모리 충실성(memory fidelity)을 핵심 원칙으로 삼아야 합니다.
      구체적인 대응책으로는 사용자가 부여한 안전 제약이나 확인 지시는 압축 대상에서 제외해 항상 고정 보존하도록 포맷과 예시를 강제하거나, 요약된 의미 메모리와 별개로 전체 원본 로그(에피소드 메모리) 및 시스템 제약을 병행 참조하도록 설계해야 합니다.
