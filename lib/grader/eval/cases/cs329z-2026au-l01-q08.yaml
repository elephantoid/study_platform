  - id: cs329z-2026au-l01-q08-e3
    type: misconception
    note: "모델이 지시 따르기 능력이 부족해서 생긴 문제로만 단정함"
    answer: |
      이 사고가 발생한 유일한 원인은 기반 LLM 자체가 사용자의 명령을 이해하고 복종하는 지시 따르기(instruction following) 능력과 RLHF 정렬 학습이 근본적으로 부족했기 때문입니다.
      메모리 구조나 컨텍스트 관리의 문제가 아니라, 단순히 모델의 파라미터 크기가 작고 지시 이행 성능이 떨어져서 눈앞에 있는 '확인 후 삭제하라'는 문장을 읽고도 무시한 것입니다.
      따라서 메모리 설계를 바꿀 필요 없이 지시 따르기 벤치마크 점수가 더 높은 최신 대형 모델로 교체하거나 프롬프트에 '제발 지시를 잘 따르라'는 강조 문구를 반복해서 적어주면 해결됩니다.
    label: null
  - id: cs329z-2026au-l01-q08-e4
    type: offtopic
    answer: |
      이메일 관리 에이전트를 외부 Gmail API나 Microsoft Graph API와 연동할 때는 OAuth 2.0 스코프 권한을 어떻게 설정하느냐가 보안의 첫걸음입니다.
      초기 개발 단계에서는 편의를 위해 읽기·쓰기·영구 삭제 권한이 모두 포함된 전체 액세스 토큰을 발급받아 쓰는 경우가 많은데, 이러면 사고가 났을 때 복구할 방법이 없거든요.
      그래서 영구 삭제(delete) API 대신 휴지통 이동(trash) API만 허용된 최소 권한 토큰을 부여하고, 프로덕션 배포 전에는 스테이징 테스트 계정에서 드라이런(dry-run) 모드로 먼저 검증해야 합니다.
