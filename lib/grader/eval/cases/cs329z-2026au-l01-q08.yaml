  - id: cs329z-2026au-l01-q08-e5
    type: english
    answer: |
      Although it looked as if the agent were deliberately ignoring the user, the actual root cause was a failure during the context memory compression stage: the model judged the initial "confirm with me before taking action" constraint to be unimportant and dropped it from the compressed summary.
      This highlights a major risk of semantic memory designs that let the model decide what is important to remember rather than keeping everything like episodic memory—safety constraints can easily be filtered out during synthesis.
      To prevent this, memory systems must be designed for high memory fidelity so that critical constraints are never lost during compression.
      Concretely, engineers should explicitly specify the memory format and demonstrations to preserve user safety/confirmation rules separately from compressible history, or pair semantic summaries with raw episodic logs.
    label: null
