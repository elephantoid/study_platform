  - id: cs329z-2026au-l01-q08-e2
    type: partial
    omits: [c2]
    answer: |
      이메일 무단 삭제 사고의 근본 원인은 에이전트가 장시간 작동하면서 컨텍스트 메모리를 효율적으로 저장하려고 압축(context compression)하는 단계에서, 초반에 사용자가 지정한 '행동 전 반드시 확인하라'는 지시가 에이전트 관점에서 중요하지 않다고 분류되어 메모리에서 아예 사라졌기 때문입니다.
      압축 이후의 컨텍스트에는 그 확인 지시 자체가 남아 있지 않다 보니 에이전트는 아무 제약이 없는 줄 알고 삭제를 계속 진행한 것이죠.
      이를 방지하려면 메모리의 충실성(memory fidelity)을 최우선 설계 목표로 두고, 사용자의 안전 제약이나 권한 확인 지시는 컨텍스트 압축 시 절대 삭제되지 않도록 별도 슬롯에 고정 보존하거나 원본 전체 로그를 병행해서 유지해야 합니다.
