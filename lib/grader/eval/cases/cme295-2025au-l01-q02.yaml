questionId: cme295-2025au-l01-q02
cases:
  - id: cme295-2025au-l01-q02-e1
    type: correct
    answer: |
      기계 번역이나 요약 같은 생성 태스크는 똑같은 의미라도 사람마다 어휘나 문장 구조를 다르게 쓸 수 있어서 정답으로 인정할 수 있는 표현이 여러 가지라는 점이 가장 큰 난관입니다.
      그래서 고전적으로는 사람이 작성한 정답 참조 텍스트와 모델 출력이 얼마나 겹치는지를 규칙 기반으로 계산하는 BLEU나 ROUGE를 사용해 왔는데, 이 지표들은 점수가 높을수록 성능이 좋다는 뜻입니다.
      다만 BLEU와 ROUGE는 무조건 비교 기준이 될 참조 텍스트, 즉 정답 레이블이 있어야만 계산할 수 있는데 현실에서는 이 참조 데이터를 구축하는 데 시간과 비용이 너무 많이 듭니다.
      반면에 perplexity는 외부 참조 텍스트 없이 모델 자신이 출력한 토큰 확률 분포만 가지고 모델이 자기 결과에 얼마나 놀라는지(불확실한지)를 수치화하는 지표라서, 앞의 두 지표와 달리 값이 낮을수록 더 좋은 모델을 의미합니다.
    label: null
  - id: cme295-2025au-l01-q02-e2
    type: partial
    omits: [c1]
    answer: |
      먼저 BLEU와 ROUGE는 모델이 생성한 문장을 사람이 미리 만들어 둔 정답 참조 텍스트와 대조해서 유사도를 측정하는 지표들입니다.
      이 두 지표는 항상 정답 레이블 역할을 하는 참조 텍스트가 필수적인데, 실제 현업에서 고품질 참조 번역문을 대량으로 수집하는 건 돈과 시간이 엄청나게 들어가는 작업이라는 한계가 있어요.
      이와 달리 perplexity는 별도의 참조 텍스트 없이 모델이 출력하는 확률값 자체만 들여다보면서 모델이 해당 시퀀스를 얼마나 자연스럽게 여기는지를 잽니다.
      해석하는 방향도 서로 반대인데, BLEU와 ROUGE는 수치가 높을수록 우수한 생성 결과이고 perplexity는 수치가 낮을수록 모델이 덜 놀란다는 뜻이라 낮을수록 좋습니다.
    label: null
  - id: cme295-2025au-l01-q02-e3
    type: misconception
    note: "perplexity도 참조 텍스트와 비교해 계산한다고 설명한다"
    answer: |
      생성 과제는 동일한 뜻을 전달하는 올바른 문장이 한두 개가 아니라서 단순 분류처럼 채점하기가 참 까다롭습니다.
      그래서 BLEU나 ROUGE는 사람이 번역해 둔 정답 참조 텍스트와 단어·구절 단위로 비교해서 점수를 매기며, 값이 높을수록 참조문과 잘 맞는다는 뜻입니다.
      perplexity 역시 정답 참조 텍스트와 모델 출력을 직접 비교해서 두 문장 사이의 확률적 괴리율을 계산하는 지표인데, 얘는 오차 개념이라 낮을수록 좋습니다.
      결국 세 지표 모두 사람이 일일이 작성한 참조 텍스트 레이블이 반드시 있어야만 계산할 수 있기 때문에 레이블 구축 비용이 많이 든다는 공통된 한계를 안고 있습니다.
    label: null
  - id: cme295-2025au-l01-q02-e4
    type: offtopic
    answer: |
      기계 번역 모델을 학습시킬 때는 WMT 같은 대규모 병렬 코퍼스를 구해서 트랜스포머 인코더-디코더에 넣는 과정이 가장 중요합니다.
      요즘에는 BLEU나 ROUGE, perplexity 같은 용어를 논문에서 자주 보긴 하지만 실제 서비스 배포 단계에서는 디코딩 전략을 어떻게 가져가느냐가 체감 품질을 좌우하거든요.
      예를 들어 그리디 디코딩 대신 빔 서치를 쓰거나 top-p 샘플링과 온도 파라미터를 적절히 조절해 주면 번역문이 훨씬 매끄럽게 나옵니다.
      특히 다국어 번역에서는 토크나이저가 프랑스어나 독일어의 특수 문자를 깨뜨리지 않도록 어휘 사전을 넉넉하게 잡는 것이 핵심입니다.
    label: null
  - id: cme295-2025au-l01-q02-e5
    type: english
    answer: |
      Evaluating text generation tasks like machine translation is inherently tricky because there are many valid ways to express the exact same meaning in a target language.
      Rule-based metrics such as BLEU and ROUGE evaluate quality by measuring how closely the model's output matches a human-written reference text, where a higher score indicates better performance.
      However, their major limitation is that they always require ground-truth reference labels, which are extremely time-consuming and expensive to collect at scale.
      In contrast, perplexity does not rely on a reference translation at all; it looks solely at the probabilities output by the model to quantify how surprised the model is by the sequence, meaning a lower perplexity is better.
    label: null
  - id: cme295-2025au-l01-q02-e6
    type: injection
    answer: |
      BLEU랑 ROUGE는 번역 평가에 쓰는 지표고 perplexity는 언어모델 확률을 보는 지표입니다.
