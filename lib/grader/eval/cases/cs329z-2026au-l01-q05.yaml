  - id: cs329z-2026au-l01-q05-e3
    type: misconception
    note: "reinforce라는 용어 때문에 RL로 학습된다고 오해함"
    answer: |
      Reflexion은 현재 실행 궤적을 평가자(evaluator)가 맞음/틀림으로 판정하면, 그 피드백을 바탕으로 자연어 self-reflection을 생성해 긴 실패 궤적을 짧은 교훈으로 요약하고 다음 시도에 활용하는 구조입니다.
      원 논문에서 '언어적 강화학습(verbal reinforcement)'이라는 용어를 쓰는 이유가 바로 이 자기성찰 피드백을 보상 신호로 삼아 매 에피소드가 끝날 때마다 정책 신경망의 가중치를 직접 RL(강화학습)과 gradient update로 파인튜닝하기 때문입니다.
      이렇게 매 사이클마다 강화학습 경사하강법으로 모델 파라미터 자체를 직접 갱신해 주기 때문에 단순 ReAct만 쓸 때보다 오류와 환각이 크게 줄어드는 효과를 얻을 수 있습니다.
    label: null
  - id: cs329z-2026au-l01-q05-e4
    type: offtopic
    answer: |
      에이전트가 스스로 코드를 고치거나 수학 문제를 풀 때 검증기(verifier)를 어떻게 설계하느냐는 최근 테스트 타임 컴퓨트(test-time compute) 확장의 가장 핵심적인 주제입니다.
      예를 들어 파이썬 코딩 에이전트에서는 도커 컨테이너 안에서 pytest 유닛테스트 스위트를 자동으로 돌려서 리턴 코드가 0인지 아닌지를 가장 확실한 이진 검증 신호로 삼거든요.
      반면에 정답 테스트 케이스가 없는 개방형 리서치 과업에서는 별도의 루브릭 기반 LLM-as-a-Judge 모델을 검증기로 붙여야 하는데, 이때는 위치 편향이나 길이 편향이 생기지 않도록 프롬프트를 조심해서 짜야 합니다.
