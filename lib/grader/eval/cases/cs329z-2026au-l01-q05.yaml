questionId: cs329z-2026au-l01-q05
cases:
  - id: cs329z-2026au-l01-q05-e1
    type: correct
    answer: |
      Reflexion 아키텍처는 크게 행동을 수행해 궤적을 만드는 행위자(actor), 그 결과를 채점하는 평가자(evaluator), 그리고 실패 원인을 돌아보는 자기성찰(self-reflection) 모듈로 구성됩니다.
      한 번의 개선 사이클을 보면 먼저 행위자가 과업을 시도해 만든 현재 실행 궤적(trajectory, 단기 메모리)을 평가자에게 넘겨 이 시도가 맞았는지 틀렸는지 판정을 받습니다.
      만약 실패 판정이 나오면 자기성찰 모듈이 그 피드백을 바탕으로 "왜 이번 시도가 실패했는지"를 자연어 반성문으로 작성해서 긴 실패 궤적을 짧은 핵심 교훈이나 루브릭 형태의 자기 힌트로 압축해 경험 메모리에 쌓고, 행위자는 다음 시도에서 이 성찰 노트를 컨텍스트에 함께 넣어 행동을 교정합니다.
      이 모든 과정은 순수 프롬프트와 컨텍스트 주입만으로 돌아가기 때문에 파인튜닝이나 gradient update가 전혀 없으며, 강화학습(RL)으로 가중치를 바꾸거나 타 모델 출력을 학습하는 고전적 지식 증류(distillation)와도 완전히 다릅니다.
      강의에서 소개된 실험에 따르면 이렇게 자연어 성찰 루프를 추가하는 것만으로도 단순 ReAct만 단독으로 쓸 때보다 과업 성공률이 크게 오르고 환각(hallucination)도 현저히 줄어듭니다.
