  - id: cs329z-2026au-l01-q05-e2
    type: partial
    omits: [c4]
    answer: |
      우선 구성 요소와 사이클을 보면, 행위자가 생성한 현재 궤적(단기 메모리)을 평가자(evaluator)가 받아서 성공인지 실패인지 판정을 내립니다.
      그 판정 피드백을 받아 에이전트가 스스로 왜 오류가 발생했는지 자연어로 self-reflection을 작성하는데, 이는 길고 장황한 실패 궤적을 다음번에 참고할 수 있는 짧은 교훈이나 자기 힌트로 압축해 다음 시도 컨텍스트에 반영하는 과정입니다.
      논문 제목에 reinforce라는 단어가 들어가긴 하지만 실제 RL처럼 가중치 gradient update를 하거나 고전적인 모델 학습 방식의 distillation을 하는 게 아니라, 오직 프롬프트 문맥에 압축된 성찰 경험을 넣어주는 방식으로 작동합니다.
