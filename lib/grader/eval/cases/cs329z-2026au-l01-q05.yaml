  - id: cs329z-2026au-l01-q05-e5
    type: english
    answer: |
      In a Reflexion cycle, the actor first generates a current trajectory (acting as short-term memory), and an evaluator judges whether that trajectory succeeded or failed.
      Based on the evaluator's feedback, the self-reflection module analyzes why the error occurred in natural language, compressing the long failed trajectory into concise lessons or self-hints that are added to experience memory to guide the actor's next attempt.
      Even though the paper uses words like "reinforce" and "distill," this entire mechanism is implemented purely through prompting without any fine-tuning or gradient updates—unlike true reinforcement learning or classic model distillation, only the context window changes.
      Empirically, adding this natural-language self-reflection loop significantly outperforms standalone ReAct and substantially reduces hallucinations.
    label: null
