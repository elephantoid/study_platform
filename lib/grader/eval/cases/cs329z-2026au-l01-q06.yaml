  - id: cs329z-2026au-l01-q06-e5
    type: english
    answer: |
      In the early days, multi-agent debate—where multiple agents solve the same task and critique each other's reasoning across rounds—served as a prompting technique to boost performance under the assumption that each individual model was relatively weak.
      Today, now that foundation models are extremely capable on their own, adopting a multi-agent setup purely to get a raw reasoning performance boost offers very little benefit.
      However, multi-agent architectures remain well-justified for system design reasons such as computational efficiency and strict data access control, where one agent is isolated to handle sensitive healthcare or private data while others cannot touch it.
      Another valid pattern is hierarchical orchestration, as in Microsoft's Magentic system, where a central orchestrator decomposes a complex task and delegates subtasks to specialized agents like a file server, a coder, and a terminal runner before aggregating the final answer.
    label: null
