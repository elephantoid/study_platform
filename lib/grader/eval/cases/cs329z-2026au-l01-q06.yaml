cases:
  - id: cs329z-2026au-l01-q06-e1
    type: correct
    answer: |
      초창기에 연구자들이 multi-agent debate(다중 에이전트 토론)를 많이 썼던 건, 당시에는 개별 언어모델 하나하나의 추론 능력이 충분히 강하지 않다는 전제 아래 여러 에이전트가 서로의 추론을 읽고 토론하게 만들어 다양한 관점을 모으려는 일종의 프롬프팅 기법이었기 때문입니다.
      하지만 기반 모델 자체가 엄청나게 강력해진 지금 시점에는 단순히 추론 정확도 점수를 조금 더 높여보겠다는 목적만으로 멀티 에이전트를 도입하는 건 실익이 거의 없습니다.
      그럼에도 오늘날 멀티 에이전트를 도입할 정당한 설계상의 이유가 있다면 첫째는 비용·지연시간 측면의 효율성(efficiency)이고, 둘째는 의료 기록이나 인사 정보처럼 민감한 데이터는 승인된 전용 에이전트만 다룰 수 있게 격리하는 데이터 접근 제어(data access control)입니다.
      또한 Microsoft의 Magentic 시스템처럼 상위 orchestrator가 거대한 복합 과제를 쪼개서 파일 서버 에이전트, 코더 에이전트, 컴퓨터 터미널 에이전트 등 각기 다른 도구를 가진 전문 에이전트들에게 배정하고 마지막에 결과를 취합하는 역할 분담 구조 역시 매우 유효한 도입 근거가 됩니다.
    label: null
  - id: cs329z-2026au-l01-q06-e2
    type: partial
    omits: [c3]
    answer: |
      과거의 multi-agent debate는 똑같은 문제를 여러 에이전트가 각자 푼 뒤 라운드마다 서로의 풀이를 읽고 토론하게 하는 방식이었는데, 이는 당시 개별 모델의 성능이 약하다는 가정 아래 성능 향상을 꾀하던 프롬프팅 기법이었습니다.
      반면 파운데이션 모델의 체급과 추론력이 비약적으로 강해진 오늘날에는 오직 추론 성능 향상 하나만을 목표로 멀티 에이전트를 쓰는 것은 효과가 미미해서 정당화하기 어렵습니다.
      대신 현대적인 멀티 에이전트에서는 Magentic 같은 사례처럼 중앙의 orchestrator가 큰 과업을 하위 컴포넌트로 분해하여 파일 서버, 코더, 터미널 등 각 세부 역할을 맡은 전문 에이전트들에게 작업을 배정하고 조율하는 구조로 활용하는 것이 타당합니다.
    label: null
  - id: cs329z-2026au-l01-q06-e3
    type: misconception
    note: "[rubric에 deductions 없음] 기초 모델이 강력해질수록 단일 추론 정확도를 높이기 위해 multi-agent debate가 더욱 필수적이라고 주장함"
    answer: |
      과거 모델이 약할 때보다 오히려 오늘날처럼 기반 모델이 초고성능으로 강력해졌을 때 순수 추론 정확도(benchmark accuracy) 점수를 끌어올리기 위해 multi-agent debate를 쓰는 효과가 훨씬 더 폭발적으로 커집니다.
      즉 데이터 접근 제어나 역할 분담 같은 부수적인 시스템 이유 때문이 아니라, 단일 최신 모델이 혼자 추론할 때보다 똑같은 최신 모델 여러 개를 붙여 무한 토론을 시키는 것이 언제나 가장 큰 폭의 성능 향상 보너스를 보장한다는 점이 멀티 에이전트 도입의 유일하고도 가장 핵심적인 이유입니다.
      여기에 orchestrator를 두어 똑같은 토론 에이전트 수십 개를 동시에 돌리면 어떤 과제에서든 단일 모델 대비 압도적인 추론 점수 상승을 얻을 수 있습니다.
    label: null
  - id: cs329z-2026au-l01-q06-e4
    type: offtopic
    answer: |
      멀티 에이전트 프레임워크를 실제로 구현할 때는 AutoGen이나 CrewAI, LangGraph 중 어떤 라이브러리를 고를지가 개발 생산성에 큰 영향을 줍니다.
      특히 에이전트 간 메시지 패싱을 비동기 이벤트 큐로 구현할지, 아니면 공유 상태 그래프(StateGraph) 위에 노드와 조건부 엣지로 정의할지에 따라 디버깅 난이도가 완전히 달라지거든요.
      에이전트들이 서로 대화를 주고받다가 무한 루프에 빠지지 않도록 최대 턴 수(max_turns)와 타임아웃을 걸어두고 OpenTelemetry로 각 에이전트의 토큰 사용량을 추적하는 게 중요합니다.
