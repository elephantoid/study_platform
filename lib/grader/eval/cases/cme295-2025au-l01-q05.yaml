questionId: cme295-2025au-l01-q05
cases:
  - id: cme295-2025au-l01-q05-e1
    type: correct
    answer: |
      Word2vec에서 다음 단어나 주변 단어를 맞히게 시키는 건 일종의 대리 과제(proxy task)인데, 우리의 진짜 목적은 단어 예측기를 만드는 게 아니라 그 과정을 통해 단어들의 의미 관계가 잘 녹아든 표현(임베딩)을 얻는 데 있습니다.
      모델이 문맥을 보고 빈칸의 단어를 잘 예측할 줄 안다면 언어의 의미적 연관성을 이미 내부에 학습했다고 볼 수 있으니까요.
      구체적인 방법으로는 주변 단어들을 입력받아 가운데 타깃 단어를 맞히는 CBOW와, 반대로 중심 타깃 단어 하나를 주고 그 주변 단어들을 예측하게 하는 skip-gram 두 가지가 있습니다.
      신경망 학습이 끝난 뒤에는 어휘 크기 V짜리 one-hot 입력 벡터와 바로 곱해지는 첫 번째 은닉층(차원 d)의 가중치 행렬을 떼어내서 각 단어의 임베딩으로 씁니다.
      언제 학습을 멈출지는 에폭(epoch)을 돌면서 이 proxy task의 손실(loss) 곡선을 추적하다가 손실이 더 이상 떨어지지 않고 수렴하는 시점에 멈추면 됩니다.
    label: null
  - id: cme295-2025au-l01-q05-e2
    type: partial
    omits: [c4]
    answer: |
      Word2vec이 주변 단어나 다음 단어를 예측하는 proxy task를 푸는 이유는, 그 예측 자체가 최종 목표라서가 아니라 문맥 속에서 단어를 맞히는 능력을 기르다 보면 자연스럽게 의미 있는 단어 표현을 학습하게 되기 때문입니다.
      이때 주변 문맥 단어들을 가지고 중심 타깃 단어를 맞히는 방식을 CBOW라고 하고, 반대로 타깃 단어로부터 주변에 올 단어들을 예측하는 방식을 skip-gram이라고 부릅니다.
      작은 은닉층을 가진 신경망을 학습시키고 나면, 입력으로 들어오는 one-hot 벡터에 곱해져서 은닉 상태 벡터를 만들어 주는 그 은닉층 가중치 자체가 우리가 찾던 단어 임베딩이 됩니다.
    label: null
  - id: cme295-2025au-l01-q05-e3
    type: misconception
    note: "다음 단어 예측 정확도 자체가 최종 목표라고 설명한다"
    answer: |
      Word2vec은 주변 단어로 중심 단어를 맞히는 CBOW나 중심 단어로 주변 단어를 맞히는 skip-gram 구조를 사용하는데요.
      이렇게 학습시키는 이유는 결국 테스트 셋에서 다음 단어 예측 정확도 자체를 최대한 높이는 것이 Word2vec 모델의 최종 목표이기 때문입니다.
      구조를 보면 one-hot 입력 벡터에 은닉층 가중치를 곱해서 저차원 벡터를 얻고 소프트맥스로 예측을 수행하는데, 학습이 끝나면 이 은닉층 가중치를 임베딩으로 꺼내 씁니다.
      학습 종료 시점은 매 epoch마다 loss를 모니터링하다가 loss 곡선이 수렴할 때 멈추고 다음 단어 예측 정확도가 최고치에 도달했는지 확인하면 됩니다.
    label: null
  - id: cme295-2025au-l01-q05-e4
    type: offtopic
    answer: |
      Word2vec로 뽑은 단어 임베딩의 가장 신기한 점은 벡터끼리 덧셈과 뺄셈 연산을 했을 때 의미론적 유추(analogy)가 성립한다는 것입니다.
      유명한 예시로 왕(king) 벡터에서 남자(man)를 빼고 여자(woman)를 더하면 여왕(queen) 벡터와 가장 가까워지는 현상이 있잖아요.
      비슷하게 파리에서 프랑스를 빼고 독일을 더하면 베를린이 나오는 것처럼 국가와 수도의 관계도 선형적인 방향 벡터로 깔끔하게 정렬됩니다.
      다만 요즘에는 이런 정적 임베딩보다 BERT나 GPT처럼 문맥에 따라 단어 벡터가 동적으로 바뀌는 모델을 더 많이 쓰는 추세입니다.
    label: null
  - id: cme295-2025au-l01-q05-e5
    type: english
    answer: |
      In Word2vec, predicting the next or surrounding words serves as a proxy task because our true goal is not word prediction itself, but rather learning meaningful word representations that capture how language works.
      It offers two formulations: CBOW, which predicts a target word from its surrounding context words, and skip-gram, which predicts the surrounding context words from a single target word.
      Once the shallow neural network is trained via backpropagation on cross-entropy loss, the actual word embeddings are extracted from the hidden-layer weights that multiply the one-hot input vectors to produce the d-dimensional hidden state.
      To decide when to stop training, we monitor the proxy task loss across epochs and halt once the loss curve converges.
    label: null
