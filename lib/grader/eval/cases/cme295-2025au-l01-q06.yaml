  - id: cme295-2025au-l01-q06-e3
    type: misconception
    note: "LSTM이 이 문제를 완전히 해결했다고 주장한다"
    answer: |
      기본 RNN은 토큰을 앞에서부터 하나씩 순서대로 처리하며 hidden state에 지금까지의 문장 정보를 담아 넘기는 방식으로 어순을 처리합니다.
      하지만 역전파를 할 때 여러 시점의 항들이 연속으로 곱해지면서 1보다 작은 값들이 거듭 곱해져 0으로 사라지는 vanishing gradient 때문에 긴 문장의 앞부분을 까먹는 long-range dependency 문제가 생기고, 순차 계산이라 학습도 느립니다.
      다행히 이후에 등장한 LSTM이 hidden state 외에 중요한 정보를 따로 보존하는 cell state를 도입하면서 이러한 vanishing gradient와 장기 의존성 문제를 100% 완벽하게 해결했습니다.
      그래서 LSTM을 쓰면 문장이 아무리 길어져도 과거 정보를 잃어버리는 일은 더 이상 발생하지 않습니다.
