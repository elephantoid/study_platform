questionId: cme295-2025au-l01-q06
cases:
  - id: cme295-2025au-l01-q06-e1
    type: correct
    answer: |
      RNN은 문장의 맨 앞부터 토큰을 하나씩 차례대로 읽으면서 이전 시점까지의 문맥을 요약한 hidden state를 다음 시점으로 계속 넘겨주기 때문에 자연스럽게 어순을 반영할 수 있습니다.
      문제는 문장 끝에서 발생한 오차를 맨 앞쪽 시점까지 반영하려고 시간을 거슬러 역전파(backpropagation through time)를 할 때, 각 시점의 항들이 연쇄적으로 계속 곱해진다는 점이에요.
      이때 곱해지는 값들이 1보다 크면 기울기가 폭발해 버리고, 반대로 1보다 작으면 여러 번 곱해지면서 0으로 수렴해 버리는 vanishing gradient 현상이 발생해서 앞쪽 가중치가 전혀 업데이트되지 않습니다.
      결국 고정된 hidden state 하나에 의존하다 보니 문장이 길어질수록 먼 과거의 정보를 잊어버리는 long-range dependency 한계를 겪게 되고, 앞 시점의 hidden state 계산이 끝나야만 다음 시점을 계산할 수 있는 순차적 구조라 학습 속도가 매우 느리다는 치명적인 단점도 있습니다.
    label: null
  - id: cme295-2025au-l01-q06-e2
    type: partial
    omits: [c1]
    answer: |
      긴 시퀀스에서 RNN이 앞쪽 정보를 제대로 기억하지 못하는 핵심 원인은 역전파 과정에서의 수식 구조에 있습니다.
      마지막 시점의 예측을 학습시키려고 시간을 거슬러 역전파를 하면 시점마다 나오는 값들을 계속 곱하게 되는데, 이 값들이 1보다 작으면 곱할수록 0으로 사라지는 vanishing gradient가 생기고 1보다 크면 폭발해 버리거든요.
      기울기가 0으로 사라지면 먼 과거 시점의 정보를 반영하는 업데이트가 불가능해져서 long-range dependency(장기 의존성) 문제가 터지게 됩니다.
      게다가 특정 시점의 결과를 얻으려면 그 이전에 있는 모든 시점의 계산이 끝날 때까지 기다려야 하는 순차적 특성 때문에 시퀀스가 길어질수록 학습 연산이 엄청나게 느려집니다.
