  - id: cme295-2025au-l01-q06-e4
    type: offtopic
    answer: |
      RNN을 실제 텍스트 분류나 개체명 인식에 적용할 때는 마지막 타임스텝의 hidden state만 쓸지, 아니면 매 타임스텝마다 나오는 출력 벡터를 전부 쓸지를 태스크에 맞게 결정해야 합니다.
      예를 들어 영화 리뷰 감성 분석 같은 단일 분류에서는 문장 끝까지 다 읽은 마지막 hidden state 하나만 뽑아서 분류 층으로 투영하면 되거든요.
      반면에 품사 태깅이나 개체명 인식처럼 단어마다 라벨을 달아줘야 하는 다중 분류에서는 각 토큰 시점의 hidden state를 개별적으로 투영해서 예측값을 뽑아냅니다.
      양방향 문맥이 필요할 때는 순방향과 역방향 RNN을 겹쳐 쓰는 Bi-RNN 구조를 쓰기도 합니다.
