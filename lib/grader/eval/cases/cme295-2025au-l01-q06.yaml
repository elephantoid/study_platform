  - id: cme295-2025au-l01-q06-e5
    type: english
    answer: |
      An RNN processes tokens sequentially one at a time while maintaining a hidden state that summarizes the sentence seen so far, which allows it to capture word order.
      However, during backpropagation through time, computing gradients involves multiplying a long chain of terms across every previous time step; if these factors are less than 1, the product quickly shrinks to 0 (vanishing gradient), whereas factors greater than 1 cause it to explode.
      Because vanishing gradients prevent effective weight updates for distant steps and the entire sentence meaning is bottlenecked into a single hidden state, RNNs struggle with long-range dependencies and forget early context.
      Furthermore, because each step depends on the previous hidden state being computed first, training cannot be parallelized across time and becomes extremely slow on long sequences.
    label: null
