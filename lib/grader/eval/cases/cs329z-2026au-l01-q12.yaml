  - id: cs329z-2026au-l01-q12-e5
    type: english
    answer: |
      Relying on accuracy alone is misleading because when models are ranked by accuracy, their reliability scores do not follow the same trend, revealing a fundamental gap between raw capability and reliability—the most powerful agent is not necessarily the most reliable one.
      Following the Princeton study discussed in the lecture, reliability can be broken down into three dimensions: consistency (producing the same outcome across repeated runs), robustness (withstanding small, realistic, or irrelevant perturbations such as a blank website pop-up), and predictability (failing in ways that are legible and recoverable).
      Choosing the right evaluation metrics is critical because a poorly chosen metric can make a fragile agent look deceptively strong, so evaluations must also incorporate efficiency and harness safety, where safety audit scores often lag far behind raw task completion rates.
    label: null
