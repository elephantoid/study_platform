cases:
  - id: cs329z-2026au-l01-q12-e1
    type: correct
    answer: |
      프린스턴 연구에서도 드러났듯이 모델들을 벤치마크 정확도(accuracy) 순으로 줄 세워 봐도 실제 신뢰성(reliability) 점수는 그 순위를 따라가지 않아서, 에이전트의 능력과 신뢰성 사이에는 뚜렷한 간극(capability vs reliability)이 존재합니다.
      그래서 정확도 하나만 보면 안 되고 신뢰성을 세 가지 차원으로 쪼개 봐야 하는데, 첫째는 여러 번 반복 실행해도 같은 결과를 내는 일관성(consistency), 둘째는 빈 팝업창처럼 작고 무관한 현실적 교란이 끼어들어도 흔들리지 않는 강건성(robustness), 셋째는 실패했을 때 그 이유를 사람이 이해하고 복구할 수 있는 예측 가능성(predictability)입니다.
      나아가 평가 지표 선택(metric choice)을 잘못하면 실제로는 취약한 에이전트가 겉으로만 훌륭해 보이는 착시를 부르기 때문에, 단순 과제 완료율뿐 아니라 비용 효율성과 하네스 안전성(실제 감사에서 완료율보다 훨씬 낮게 나타난 안전 지표)까지 다각도로 평가해야 합니다.
    label: null
  - id: cs329z-2026au-l01-q12-e2
    type: partial
    omits: [c3]
    answer: |
      에이전트 평가에서 단순히 정확도 점수만 보면 위험한 이유는, 모델들을 정확도 순위로 나열해 봐도 신뢰성 점수는 전혀 같은 추세를 보이지 않을 만큼 능력(capability)과 신뢰성(reliability) 사이에 큰 괴리가 있기 때문입니다.
      즉 가장 정확도가 높고 강력한 에이전트가 가장 믿을 만한 에이전트는 아니라는 뜻이죠.
      이 신뢰성은 크게 세 차원으로 나누어 평가할 수 있는데, 같은 과업을 여러 차례 돌렸을 때 동일한 결과를 내는지 보는 일관성(consistency), 웹페이지의 빈 팝업처럼 사소하거나 무관한 환경 교란에 버티는지 보는 강건성(robustness), 그리고 에이전트가 실패했을 때 원인을 이해하고 복구 가능한지 보는 예측 가능성(predictability)입니다.
