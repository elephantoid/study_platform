questionId: cs329z-2026au-l01-q10
cases:
  - id: cs329z-2026au-l01-q10-e1
    type: correct
    answer: |
      workflow와 agent는 둘 다 거대언어모델에 여러 외부 컴포넌트를 결합한 compound AI system이지만, 두 개념을 가르는 핵심 기준은 "다음 실행 단계를 누가 결정하느냐(who decides the steps)"에 있습니다.
      workflow는 엔지니어가 미리 짜 놓은 고정된 순서의 스크립트(예: Agentless처럼 파일 찾기 → 패치 작성 → 테스트 실행)를 따라 돌아가며, LLM은 각 단계 내부에서만 작동할 뿐 다음에 어떤 단계로 갈지를 스스로 선택하지 않습니다.
      반면에 agent는 SWE-agent처럼 어떤 파일을 열어볼지, 어떤 명령을 실행할지, 그리고 언제 작업이 끝났는지까지 모델이 스스로 판단해 동적으로 경로를 결정하므로 훨씬 유연하고 개방적인 과업에 유리합니다.
      그렇다고 workflow가 뒤처지는 방식인 건 전혀 아니어서, 수백만 개의 후보 프로그램을 생성한 뒤 테스트와 랭킹을 거치는 고정 흐름으로 인간 경쟁자의 87% 수준에 도달한 AlphaCode 2나 실시간 외부 지식 검색을 결합한 RAG처럼 정형화된 절차에서는 workflow가 매우 강력한 성능을 발휘합니다.
    label: null
  - id: cs329z-2026au-l01-q10-e2
    type: partial
    omits: [c3]
    answer: |
      compound AI 시스템 안에서 workflow와 agent를 구분하는 가장 본질적인 기준은 '다음 스텝을 누가 결정하는가'입니다.
      workflow에서는 실행될 단계들의 순서가 사전에 스크립트처럼 고정되어 있어서, 대형 언어모델은 각 단계 안에서 주어진 역할만 수행할 뿐 다음 단계가 무엇일지 직접 고르지 않아요.
      반대로 agent에서는 모델 자체가 주도권을 쥐고 어떤 파일을 열지, 무엇을 실행할지, 언제 과업을 종료할지 등 다음 행동을 스스로 선택하기 때문에 정해진 순서로 풀 수 없는 유연한 상황에서 유리합니다.
    label: null
  - id: cs329z-2026au-l01-q10-e3
    type: misconception
    note: "agent는 항상 workflow보다 우월하다고 주장함"
    answer: |
      workflow와 agent는 다음 단계를 고정된 스크립트가 정하느냐 아니면 모델이 스스로 결정하느냐로 구분됩니다.
      workflow에서는 LLM이 정해진 단계 안에서만 일하고 다음 단계를 고르지 못하는 반면, agent는 모델이 어떤 파일을 열고 무엇을 실행할지 스스로 선택합니다.
      따라서 모델에게 자율성을 부여한 agent가 고정된 workflow보다 모든 면에서 항상 무조건 더 우월한 상위 호환 아키텍처이며, AlphaCode 2나 RAG 같은 고정 workflow는 성능이 너무 낮아 실제 문제 해결에서는 쓸모가 없습니다.
    label: null
  - id: cs329z-2026au-l01-q10-e4
    type: offtopic
    answer: |
      복합 AI 시스템(compound AI system)을 디버깅할 때는 전체 파이프라인을 시스템 계층, 데이터 계층, 평가 계층의 3가지 레이어로 나누어 어디서 병목이 생겼는지 추적하는 것이 중요합니다.
      많은 엔지니어들이 에이전트 성능이 안 나오면 시스템 아키텍처만 계속 뜯어고치는데, 막상 뜯어보면 프롬프트에 들어가는 데이터 품질이 낮거나 평가 지표(metric) 자체를 잘못 골라서 약한 에이전트가 좋아 보이는 착시가 생긴 경우가 많거든요.
      그래서 문제 발생 시 시스템·데이터·평가 중 어느 층의 결함인지 먼저 진단하는 습관이 필요합니다.
    label: null
  - id: cs329z-2026au-l01-q10-e5
    type: english
    answer: |
      Both workflows and agents are compound AI systems that combine large models with other components, and the key criterion separating them is who decides the steps.
      In a workflow—such as Agentless fixing a GitHub issue through a fixed sequence of finding the file, writing a patch, and running tests—the order of stages is scripted in advance, and the LLM works inside each stage without ever picking the next one.
      In an agent—such as SWE-agent—the model itself dynamically decides which files to open, what commands to run, and when the task is finished, making it better suited for open-ended exploration.
      Still, workflows can be extraordinarily powerful when the procedure is well-structured, as shown by AlphaCode 2 generating, testing, and ranking millions of candidate programs to beat 87% of human competitors, or Retrieval-Augmented Generation (RAG) for factual question answering.
    label: null
