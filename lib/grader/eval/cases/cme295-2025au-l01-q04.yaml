cases:
  - id: cme295-2025au-l01-q04-e1
    type: correct
    answer: |
      어휘 사전에 있는 단어 개수만큼의 길이를 가진 벡터에서 자기 자리만 1이고 나머지는 전부 0으로 채우는 게 one-hot 인코딩이잖아요.
      이렇게 표현해 버리면 서로 다른 두 단어 벡터를 골라 내적을 해봤을 때 항상 0이 나오니까, 모든 단어 벡터가 서로 수직(직교)인 상태가 되어 cosine similarity가 전부 0으로 똑같아집니다.
      하지만 우리가 실제로 원하는 건 '강아지'와 '고양이'처럼 의미가 비슷한 단어들은 벡터가 비슷한 방향을 가리켜서 유사도가 높게 나오고, '강아지'와 '책상'처럼 전혀 상관없는 단어들은 직교에 가까워서 유사도가 0 부근으로 나오는 표현 공간이거든요.
      그래서 이런 의미적 유사성과 관계를 벡터 공간에 담아내기 위해 어휘 크기보다 훨씬 작은 차원(예컨대 수백 차원)을 가지는 밀집 벡터인 임베딩을 데이터로부터 직접 학습해야 합니다.
    label: null
  - id: cme295-2025au-l01-q04-e2
    type: partial
    omits: [c2]
    answer: |
      토큰을 one-hot 벡터로 만들면 각 토큰마다 1이 켜지는 인덱스가 다 다르기 때문에 어떤 두 토큰 벡터를 가져와도 서로 직교하게 됩니다.
      벡터가 직교한다는 건 두 벡터 사이의 각도가 90도라는 뜻이라서, cosine similarity를 계산해 보면 단어의 뜻과 무관하게 언제나 0이 나와 버려요.
      이 문제를 해결하려면 고정된 희소 벡터를 쓰는 대신, 어휘 크기보다 훨씬 작은 차원으로 압축된 밀집 벡터 형태의 임베딩을 말뭉치 데이터로부터 학습시켜서 써야 합니다.
    label: null
  - id: cme295-2025au-l01-q04-e3
    type: misconception
    note: "one-hot 벡터가 의미 유사성을 이미 잘 반영한다고 설명한다"
    answer: |
      사실 one-hot 인코딩 자체도 각 단어마다 고유한 축을 할당해 주기 때문에, 두 one-hot 벡터의 cosine similarity를 구해보면 단어 간의 의미적 유사성을 이미 꽤 잘 반영하고 있습니다.
      비슷한 문맥에 쓰이는 단어들은 one-hot 공간에서도 자연스럽게 비슷한 각도를 이루게 되거든요.
      다만 어휘 사전 크기가 수만에서 수십만 개로 커지면 벡터 차원이 너무 비대해져서 메모리와 행렬 곱셈 비용이 많이 든다는 게 유일한 단점입니다.
      그래서 순전히 차원 축소를 통해 연산 속도를 높이기 위한 목적으로 작은 차원의 임베딩을 학습해서 사용하는 것입니다.
    label: null
  - id: cme295-2025au-l01-q04-e4
    type: offtopic
    answer: |
      임베딩 벡터들 사이의 유사도를 구할 때 현업에서는 cosine similarity 외에도 유클리드 거리나 내적(dot product)을 벡터 데이터베이스 인덱싱에 자주 활용합니다.
      특히 FAISS나 Milvus 같은 벡터 검색 엔진을 쓸 때 모든 임베딩 벡터를 L2 노름으로 미리 정규화해 두면 내적 연산이 곧바로 cosine similarity와 같아져서 검색 속도가 훨씬 빨라지거든요.
      다만 고차원 임베딩 공간에서는 허브니스(hubness) 현상 때문에 특정 벡터가 모든 쿼리의 최근접 이웃으로 자주 뽑히는 문제가 생길 수 있어서 코사인 거리 분포를 주기적으로 모니터링해야 합니다.
    label: null
  - id: cme295-2025au-l01-q04-e5
    type: english
    answer: |
      When we represent tokens as one-hot vectors, every token has a 1 at its unique vocabulary index and 0s everywhere else, which makes all distinct token vectors orthogonal to one another.
      Consequently, the cosine similarity between any two different words is always 0, completely failing to capture that "teddy bear" is semantically closer to "soft" than to "book."
      What we actually want is a vector space where words with similar meanings point in similar directions and have high cosine similarity, while unrelated words remain close to orthogonal.
      To achieve this, we learn dense, lower-dimensional embeddings directly from data so that semantic relationships are encoded into the geometry of the vectors.
    label: null
