  - id: cme295-2025au-l01-q07-e2
    type: partial
    omits: [c3]
    answer: |
      가장 큰 차이는 RNN처럼 이전 시점의 결과가 나올 때까지 기다리며 한 토큰씩 순서대로 처리하지 않고, 시퀀스 안의 모든 토큰을 단번에 직접 연결로 바라본다는 점입니다.
      덕분에 똑같은 단어라도 주변에 어떤 단어들이 있느냐에 따라 문맥에 맞는 고유한 표현을 바로 계산할 수 있어요.
      구체적으로는 현재 토큰의 query를 다른 모든 토큰들의 key와 비교해서 어떤 토큰이 가장 유사하고 중요한지 점수를 매기고요.
      그 유사도 점수에 softmax를 적용해 확률 가중치로 만든 다음, 각 토큰에 대응하는 value 벡터들을 가중 평균 내서 새로운 문맥 표현을 만들어 냅니다.
