  - id: cme295-2025au-l01-q07-e3
    type: misconception
    note: "Q, K, V가 사람이 고정해 둔 값이라고 설명한다"
    answer: |
      self-attention은 RNN의 순차 처리 방식과 달리 문장 속 모든 토큰 쌍을 한 번에 직접 연결해서 행렬 연산으로 처리하기 때문에 GPU 병렬화에 아주 유리합니다.
      계산할 때는 먼저 query와 각 토큰의 key를 비교해 유사도를 구하고, softmax를 거쳐 나온 가중치로 value들의 가중합을 구하는 방식을 씁니다.
      이때 사용하는 query, key, value 값들은 모델이 학습하는 파라미터가 아니라, 사람이 사전에 어휘 사전마다 고정된 규칙으로 미리 지정해 둔 상수 벡터들입니다.
      그렇게 사람이 고정해 둔 Q, K, V 테이블에서 값을 꺼내서 내적과 가중합만 수행하면 되기 때문에 계산이 아주 단순하고 빠릅니다.
    label: null
  - id: cme295-2025au-l01-q07-e4
    type: offtopic
    answer: |
      최근 거대언어모델에서는 self-attention의 시퀀스 길이 제곱에 비례하는 메모리 병목을 줄이기 위해 FlashAttention 같은 하드웨어 친화적인 커널 최적화를 필수적으로 씁니다.
      GPU의 HBM(고대역폭 메모리)과 SRAM 사이의 읽기·쓰기 횟수를 줄이는 타일링 기법을 쓰면 똑같은 self-attention 수식을 계산하면서도 속도가 몇 배나 빨라지거든요.
      또 추론 시점에는 이전에 계산해 둔 key와 value 텐서를 버리지 않고 KV 캐시에 저장해 두었다가 다음 토큰을 생성할 때 재사용하는 방식을 많이 씁니다.
    label: null
  - id: cme295-2025au-l01-q07-e5
    type: english
    answer: |
      Unlike RNNs, which process tokens sequentially one step at a time, self-attention connects every token directly to all other tokens in the sequence at once to compute contextualized representations.
      In this mechanism, we compare a target token's query vector against the key vectors of all tokens in the sequence to measure their similarity, apply a softmax to turn those scores into weights, and take a weighted sum of the corresponding value vectors.
      The query, key, and value representations are obtained by multiplying the input embeddings with learned projection matrices trained by the model.
      Because this entire computation across the sequence is formulated as matrix multiplications, it maps naturally onto GPUs for highly parallel execution.
    label: null
