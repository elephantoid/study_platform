  - id: cme295-2025au-l01-q07-e1
    type: correct
    answer: |
      RNN은 문장 맨 앞 토큰부터 차례대로 하나씩 읽어가며 순차 처리를 해야 하지만, self-attention은 그런 순차적 단계를 없애고 한 토큰의 표현을 구할 때 문장 내의 모든 다른 토큰들과 한 번에 직접 연결을 맺어 문맥을 반영합니다.
      이 과정에서 각 토큰은 query, key, value라는 세 가지 역할을 동시에 수행하는데요.
      내가 지금 표현을 만들고 싶은 기준 토큰의 query를 문장 안의 모든 토큰들의 key와 내적해서 얼마나 관련이 깊은지 유사도를 재고, 그 점수에 softmax를 씌워 가중치로 바꾼 뒤 각 토큰의 실제 정보인 value를 가중합해서 최종 표현을 얻습니다.
      여기서 Q, K, V 벡터들은 고정된 게 아니라 입력 임베딩에 모델이 학습하는 투영(projection) 행렬을 곱해서 만들어지며, 시퀀스 전체 연산을 커다란 행렬 곱셈으로 한꺼번에 묶어 처리할 수 있어서 GPU 하드웨어에서 엄청나게 빠르게 돌아갑니다.
