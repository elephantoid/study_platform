questionId: cme295-2025au-l01-q01
cases:
  - id: cme295-2025au-l01-q01-e1
    type: correct
    answer: |
      신용카드 사기 탐지나 희귀 질환 진단처럼 정상 데이터가 99.9%이고 이상 데이터가 0.1%뿐인 상황을 생각해 보면 이해가 쉽습니다.
      이런 불균형 데이터셋에서는 모델이 아무 학습도 하지 않고 무조건 모든 샘플을 다수 클래스인 정상으로만 찍어도 accuracy가 99.9%가 나와서 마치 훌륭한 모델처럼 착시를 일으키거든요.
      그래서 이럴 때는 모델이 양성이라고 예측한 건들 중에서 진짜 양성이 얼마나 되는지 따지는 precision과, 실제 전체 양성 샘플 가운데 모델이 놓치지 않고 찾아낸 비율인 recall을 분리해서 봐야 합니다.
      업무에서 두 지표를 한눈에 비교해야 할 때는 precision과 recall의 조화평균을 구해서 하나의 대표 숫자로 요약해 주는 F1 스코어를 기준으로 삼는 게 안전합니다.
    label: null
  - id: cme295-2025au-l01-q01-e2
    type: partial
    omits: [c3]
    answer: |
      클래스 비율이 한쪽으로 심하게 쏠려 있을 때 accuracy만 보면 모델 성능을 완전히 오판할 수 있어요.
      예를 들어 스팸 메일이 전체의 1%밖에 안 된다면, 모든 메일을 정상 메일이라고 무조건 찍는 바보 같은 분류기를 만들어도 accuracy는 99%가 찍히니까요.
      이를 보완하려면 양성으로 분류한 결과 중 실제로 맞힌 비율을 뜻하는 precision을 확인해서 오탐이 얼마나 나는지 봐야 합니다.
      동시에 실제로 양성인 데이터 중에서 모델이 얼마나 빠짐없이 양성으로 잡아냈는지를 나타내는 recall도 함께 확인해야 누락 위험을 막을 수 있습니다.
    label: null
  - id: cme295-2025au-l01-q01-e3
    type: misconception
    note: "precision과 recall의 정의를 서로 뒤바꿔 설명한다"
    answer: |
      감성 분석 데이터에서 긍정 리뷰가 압도적으로 많고 부정 리뷰가 극소수라면, 모델이 전부 다수 클래스로만 예측해도 accuracy는 아주 높게 나오는 함정이 있습니다.
      그래서 불균형 문제에서는 precision과 recall을 반드시 같이 봐야 하는데요.
      여기서 precision은 실제 양성인 전체 정답 데이터 중에서 우리 모델이 양성이라고 제대로 찾아낸 비율을 말하고요.
      반대로 recall은 모델이 양성이라고 예측을 던진 것들 가운데 실제로 맞은 비율을 뜻합니다.
      마지막으로 이 두 값의 조화평균을 내서 하나의 수치로 묶어 주는 F1 스코어까지 챙겨 보면 불균형 데이터를 제대로 평가할 수 있습니다.
    label: null
  - id: cme295-2025au-l01-q01-e4
    type: offtopic
    answer: |
      감성 분류 과제에서 클래스 불균형이 심할 때는 보통 데이터 전처리 단계에서 오버샘플링이나 언더샘플링을 먼저 적용하곤 합니다.
      특히 SMOTE 같은 기법으로 소수 클래스의 합성 샘플을 만들어 주거나, 손실 함수에 클래스별 가중치를 다르게 주는 Focal Loss를 쓰면 학습이 훨씬 안정적으로 수렴하더라고요.
      최근에는 거대언어모델로 부족한 부정 감성 리뷰 텍스트를 증강해서 학습 데이터 비율을 5대 5로 맞춰 주는 접근도 실무에서 많이 씁니다.
      이렇게 데이터 분포 자체를 균형 있게 잡아주면 분류기의 결정 경계가 한쪽으로 밀리는 현상을 효과적으로 막을 수 있습니다.
    label: null
  - id: cme295-2025au-l01-q01-e5
    type: english
    answer: |
      When a dataset is heavily imbalanced, relying solely on accuracy is dangerous because a trivial classifier that always predicts the majority class will still achieve an artificially high score.
      For instance, if 99% of reviews are positive and only 1% are negative, predicting positive every single time yields 99% accuracy while failing completely on the minority class.
      To fix this, we look at precision, which measures the proportion of predicted positives that are truly positive, and recall, which measures the proportion of actual positives that the model successfully identified.
      Finally, we use the F1 score, which takes the harmonic mean of precision and recall to summarize both aspects into a single balanced number.
    label: null
