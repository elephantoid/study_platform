  - id: cme295-2025au-l01-q10-e2
    type: partial
    omits: [c2]
    answer: |
      행렬 관점에서 보면 Q 행렬에서는 각 행이 하나의 query 벡터이고, 전치 행렬인 `K^T`에서는 각 열이 하나의 key 벡터에 해당합니다.
      따라서 두 행렬을 곱한 `QK^T`를 계산하면 그 결과 행렬의 각 행은 특정 query 하나가 문장 내 모든 key들과 내적(projection)된 유사도 점수들을 일렬로 모아 놓은 형태가 돼요.
      그런데 query와 key의 차원(`d_k`, 내적이 성립하므로 `d_q`와 동일)이 커질수록 내적에서 더해지는 항이 많아져서 dot product 값 자체가 지나치게 커지는 경향이 나타납니다.
      그래서 내적값의 스케일이 차원 크기에 따라 폭증하지 않도록 정규화하기 위해 `sqrt(d_k)`로 나누어 주는 과정을 거칩니다.
