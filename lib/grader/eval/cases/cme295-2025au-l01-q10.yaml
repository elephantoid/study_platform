  - id: cme295-2025au-l01-q10-e1
    type: correct
    answer: |
      scaled dot-product attention 수식인 `softmax(QK^T / sqrt(d_k))V`를 행렬 모양으로 따라가 보면, 먼저 입력 임베딩을 투영해서 얻은 Q 행렬은 각 행(row)이 개별 토큰의 query 벡터를 나타냅니다.
      여기에 K 행렬을 전치한 `K^T`를 곱하는데, `K^T`의 각 열(column)이 각 토큰의 key 벡터이므로 두 행렬을 곱한 `QK^T`의 각 행은 하나의 query가 시퀀스 내 모든 key들과 내적해서 얻은 유사도 점수 벡터가 됩니다.
      그다음 이 점수들을 `sqrt(d_k)`로 나눠 준 뒤 행(row) 단위로 softmax를 취하면 각 query마다 어떤 key에 얼마나 집중할지를 나타내는 합이 1인 확률분포(가중치)가 만들어지고, 마지막으로 여기에 V 행렬을 곱해 각 query에 대한 value 벡터들의 가중합을 최종 출력으로 얻습니다.
      이때 `sqrt(d_k)`로 스케일링해 주는 이유는 query와 key의 벡터 차원인 `d_k`가 커질수록 내적(dot product) 결과값의 크기와 분산도 함께 커지는 경향이 있어서, 이를 `sqrt(d_k)`로 나누어 값을 적정한 범위로 정규화해 주려는 것입니다.
