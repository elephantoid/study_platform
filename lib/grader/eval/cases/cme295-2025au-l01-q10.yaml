  - id: cme295-2025au-l01-q10-e3
    type: misconception
    note: "sqrt(d_k) 스케일링을 value의 차원이나 batch 크기와 연관시켜 설명한다"
    answer: |
      먼저 Q 행렬의 각 행은 토큰별 query이고 `K^T`의 각 열은 토큰별 key라서, `QK^T`를 곱하면 각 행마다 해당 query가 모든 key들과 얼마나 유사한지 내적 점수가 구해집니다.
      여기에 행별로 softmax를 적용해서 각 query에 대한 key들의 확률분포 가중치를 뽑고, 마지막에 V 행렬을 곱해주면 각 토큰의 value 벡터들을 가중합한 결과 행렬이 나옵니다.
      수식 가운데에 있는 `sqrt(d_k)`로 나누는 이유는 미니배치의 batch 크기나 마지막에 곱해지는 value 행렬 V의 출력 차원이 커질 때 메모리 오버플로가 나는 것을 막기 위해서입니다.
      즉 batch 크기와 value 차원에 비례해서 커지는 출력 노름을 줄여주기 위해 `sqrt(d_k)` 스케일링을 해주는 것입니다.
    label: null
  - id: cme295-2025au-l01-q10-e4
    type: offtopic
    answer: |
      트랜스포머에서 `softmax(QK^T / sqrt(d_k))V` 연산의 시간 및 공간 복잡도를 계산해 보면 시퀀스 길이를 n이라고 할 때 `QK^T` 행렬의 크기가 `n x n`이 되기 때문에 `O(n^2)`의 복잡도를 가집니다.
      문장 길이가 2천 토큰에서 10만 토큰으로 늘어나면 어텐션 맵 행렬 하나를 저장하는 데만 수십 기가바이트의 VRAM이 소모되는 이유가 바로 이 때문이거든요.
      그래서 긴 문맥을 다루는 최신 모델들은 슬라이딩 윈도우 어텐션이나 선형 어텐션(Linear Attention), 혹은 Sparse Attention으로 이 이차 복잡도를 줄이려고 연구하고 있습니다.
