  - id: cme295-2025au-l01-q10-e5
    type: english
    answer: |
      In the scaled dot-product attention formula `softmax(QK^T / sqrt(d_k))V`, each row of matrix Q represents a token's query vector while each column of `K^T` represents a token's key vector, so each row of the product `QK^T` contains the dot-product similarity scores between one query and all keys.
      We divide these scores by `sqrt(d_k)` because as the query and key dimension `d_k` grows larger, the magnitude of the dot products tends to grow large as well, and dividing by `sqrt(d_k)` normalizes them back to a well-behaved scale.
      Next, applying softmax row-wise converts each query's scores into a probability distribution of weights over the keys.
      Finally, multiplying that probability matrix by V computes a weighted sum of the value vectors for every query in parallel.
