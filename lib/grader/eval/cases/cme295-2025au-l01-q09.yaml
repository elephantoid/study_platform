questionId: cme295-2025au-l01-q09
cases:
  - id: cme295-2025au-l01-q09-e1
    type: correct
    answer: |
      자연어에서 다음 단어를 예측할 때는 "오늘 날씨가 참 ___" 뒤에 '좋다', '맑다', '화창하다'처럼 맥락상 말이 되는 정답 후보가 여러 개일 수밖에 없잖아요.
      그런데 학습 데이터의 정답 단어 하나에만 100%(1.0)를 주고 나머지 단어는 전부 0으로 둔 one-hot 레이블을 강요하면, 모델이 그 특정 단어 하나에만 지나치게 과신하도록 학습되는 문제가 생깁니다.
      그래서 label smoothing은 정답 레이블 자체를 살짝 부드럽게 깎아주는데, 정답 토큰 위치에는 1 대신 `1 - epsilon`을 주고 나머지 `V - 1`개의 어휘들에게는 `epsilon / (V - 1)`씩 작은 확률을 골고루 나눠 줍니다.
      이렇게 타깃 레이블을 바꿔서 학습시키면 모델이 단일 예측에 과도하게 확신하지 않게 되어 기계 번역의 BLEU 점수 같은 일반화 지표가 실제로 향상됩니다.
      참고로 softmax는 모델의 예측 출력값을 확률 분포로 만들어 줄 뿐 우리가 비교할 정답 레이블(1, 0, 0...) 자체를 완화해 주지는 못하므로, 반드시 레이블 쪽에 label smoothing을 따로 적용해야 합니다.
    label: null
  - id: cme295-2025au-l01-q09-e2
    type: partial
    omits: [c4]
    answer: |
      자연어 생성에서는 특정 문맥 뒤에 이어질 수 있는 자연스러운 단어가 한 가지만 있는 게 아니라 여러 선택지가 존재한다는 점 때문에 label smoothing이 고안되었습니다.
      원래의 one-hot 레이블(1, 0, 0, ...)을 그대로 쓰면 모델이 오직 한 단어만 무조건 정답이라고 과신하게 되거든요.
      이를 막기 위해 정답 위치의 레이블 값을 `1 - epsilon`으로 낮추고, 남은 `epsilon`을 나머지 `V - 1`개 토큰들에 `epsilon / (V - 1)`씩 분배해서 "이 단어가 맞겠지만 다른 단어일 가능성도 조금은 있다"고 학습 목표를 수정합니다.
      그 결과 모델이 자기 예측을 덜 과신하게 되고, 실제 Transformer 논문에서도 번역 평가 지표인 BLEU가 개선되는 효과를 거두었습니다.
    label: null
  - id: cme295-2025au-l01-q09-e3
    type: misconception
    note: "label smoothing이 모델 출력(softmax)이나 추론 시 샘플링을 바꾸는 기법이라고 설명한다"
    answer: |
      자연어에서는 빈칸 뒤에 올 수 있는 올바른 단어가 여러 개라서 모델이 한 단어만 과신하지 않게 만들어 주는 게 중요하고, 이를 통해 BLEU 점수도 높일 수 있습니다.
      이걸 해주는 label smoothing은 정답 one-hot 레이블은 그대로 둔 채, 추론 시점에 모델의 마지막 출력 층인 softmax 함수 내부에 epsilon 파라미터를 넣어서 출력 확률 분포와 샘플링 온도를 평평하게 깎아주는 기법입니다.
      즉 학습할 때 비교하는 타깃 레이블은 여전히 [1, 0, 0, ...]이지만, 모델이 추론할 때 softmax 출력을 `1 - epsilon` 비율로 눌러서 다양한 단어가 샘플링되도록 디코딩 단계를 바꾸는 원리입니다.
    label: null
  - id: cme295-2025au-l01-q09-e4
    type: offtopic
    answer: |
      트랜스포머를 학습시킬 때 과적합을 막고 학습을 안정화하기 위해 쓰는 정규화(regularization) 기법으로는 드롭아웃(dropout)과 가중치 감쇠(weight decay, AdamW), 그리고 학습률 워밍업 스케줄러가 있습니다.
      특히 원 논문에서는 학습 초반 수천 스텝 동안은 학습률을 선형적으로 올렸다가 그 이후에는 스텝 수의 역제곱근에 비례해서 학습률을 줄여나가는 Noam 스케줄러를 써서 초기 발산을 잡았거든요.
      여기에 잔차 연결(residual connection)과 층 정규화(layer normalization)까지 더해지면 수십 층을 깊게 쌓아도 기울기가 안정적으로 흐르게 됩니다.
    label: null
  - id: cme295-2025au-l01-q09-e5
    type: english
    answer: |
      In natural language processing, there are often multiple valid words that can follow a given prefix—such as "What a great day," "lecture," or "book"—so forcing the model to match a strict one-hot target of 1 and 0s pushes it to become overconfident.
      Label smoothing addresses this by modifying the ground-truth target distribution itself, assigning `1 - epsilon` to the target token and distributing `epsilon / (V - 1)` across all remaining vocabulary tokens.
      This teaches the model to be less certain about a single deterministic answer and empirically improves downstream generation metrics like BLEU in machine translation.
      Note that softmax alone does not give this effect for free because softmax only normalizes the model's predicted logits, whereas label smoothing alters the target label against which cross-entropy loss is computed.
    label: null
