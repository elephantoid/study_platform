  - id: cs329z-2026au-l01-q07-e5
    type: english
    answer: |
      Even as LLM context windows grow larger, agents still need external memory for two main reasons: first, a context window cannot hold the entire event stream of a long-horizon task running for three or more hours, and second, even if you stuffed a thousand documents into context, the search space becomes so large that the agent struggles to locate the relevant piece of information efficiently.
      In terms of what each memory type stores, episodic memory records everything verbatim—every raw log, time step, and sentence exchanged between the user and the agent.
      Semantic memory instead synthesizes agent trajectories into compact summaries of meaningful semantic events rather than keeping raw logs.
      Finally, procedural memory abstracts and stores reusable skills or procedures—as demonstrated in NVIDIA's Voyager agent for Minecraft, which saves newly learned skills into a skill library and retrieves them whenever a new task requires them.
    label: null
