  - id: cs329z-2026au-l01-q07-e1
    type: correct
    answer: |
      LLM의 context window가 아무리 넓어져도 에이전트에게 외부 메모리가 꼭 필요한 이유는 첫째, 세 시간 이상 돌아가는 장기 과제(long-horizon task)에서 발생하는 방대한 이벤트 스트림을 컨텍스트 창 하나에 전부 다 우겨넣을 수 없기 때문이고, 둘째, 설령 문서 천 개를 컨텍스트에 다 넣는다 해도 탐색 공간이 너무 커져서 지금 당장 필요한 관련 정보가 무엇인지 모델이 찾아내기가 극도로 어렵고 오래 걸리기 때문입니다.
      이 메모리를 무엇을 저장하느냐에 따라 세 가지로 나누면, 먼저 에피소드 메모리(episodic memory)는 타임스텝마다 사용자와 에이전트가 주고받은 모든 문장과 행동의 원본 로그(raw logs) 전체를 있는 그대로 기록합니다.
      반면 의미 메모리(semantic memory)는 원시 로그를 다 쌓는 대신 지난 몇 분간의 궤적을 종합·합성(synthesis)해서 핵심적인 의미 사건이나 요약 상자 형태로 정제해 저장합니다.
      마지막으로 절차 메모리(procedural memory)는 개별 사건의 구체적 내용이 아니라 '특정 과업을 수행하는 방법과 절차(스킬)'를 추상화해 저장하는데, 예를 들어 마인크래프트 에이전트인 Voyager처럼 새로 익힌 도구 사용법을 스킬 라이브러리에 저장해 두었다가 새로운 과제가 주어졌을 때 검색해서 꺼내 쓰는 방식입니다.
    label: null
  - id: cs329z-2026au-l01-q07-e2
    type: partial
    omits: [c4]
    answer: |
      컨텍스트 윈도우가 점점 커지고 있는데도 외부 메모리가 필요한 첫 번째 이유는, 몇 시간씩 이어지는 장기 작업에서 쏟아지는 모든 이벤트 스트림을 컨텍스트 윈도우가 끝까지 다 담아낼 수 없기 때문입니다.
      두 번째 이유는 설사 그 많은 문서를 컨텍스트 안에 다 넣을 수 있다고 쳐도, 탐색해야 할 공간이 너무 비대해져서 에이전트가 현재 스텝에 꼭 필요한 관련 정보를 정확히 골라내기가 무척 힘들다는 점이에요.
      저장 대상을 기준으로 메모리를 분류해 보면, 에피소드 메모리는 매 시점 일어난 모든 대화와 행동의 원본 로그를 통째로 저장하고, 의미 메모리는 궤적들을 종합해 요약·합성된 주요 사건을 저장하며, 절차 메모리는 세부 로그가 아니라 특정 유형의 일을 처리하는 방법(스킬·절차) 자체를 저장한다는 차이가 있습니다.
    label: null
  - id: cs329z-2026au-l01-q07-e3
    type: misconception
    note: "에피소드 메모리는 요약된 핵심 사건만 저장하고 의미 메모리는 모든 대화 원본 로그를 저장한다고 서로 뒤바꿔 설명함"
    answer: |
      외부 메모리가 필요한 이유는 첫째로 수 시간 동안 이어지는 장기 과제의 이벤트 스트림을 컨텍스트 윈도우에 다 넣을 수 없고, 둘째로 다 넣더라도 너무 방대해서 필요한 관련 정보를 찾아내기가 어렵기 때문입니다.
      메모리 종류를 보면 먼저 에피소드 메모리(episodic memory)는 원본 로그를 버리고 지난 궤적을 종합해 핵심적으로 요약·합성된 짧은 사건 박스만 압축해서 저장하는 메모리입니다.
      반대로 의미 메모리(semantic memory)는 요약 없이 매 타임스텝마다 에이전트와 사용자가 주고받은 모든 문장과 원시 로그(raw logs) 전체를 하나도 빠짐없이 그대로 저장하는 방식입니다.
      그리고 절차 메모리는 Voyager의 스킬 라이브러리처럼 일을 수행하는 절차와 스킬을 저장해 두고 다음 과업에서 검색해 재사용하는 메모리를 뜻합니다.
    label: null
  - id: cs329z-2026au-l01-q07-e4
    type: offtopic
    answer: |
      에이전트의 장기 메모리 저장소를 백엔드에 구축할 때는 관계형 데이터베이스인 PostgreSQL에 pgvector 확장을 붙이거나 Pinecone, Qdrant 같은 전용 벡터 데이터베이스를 많이 씁니다.
      단순 코사인 유사도만 가지고 과거 기억을 조회하면 최근에 일어난 중요한 사건보다 옛날에 있었던 비슷한 단어의 로그가 먼저 끌려 올라오는 문제가 자주 생기거든요.
      그래서 스탠퍼드 Smallville 논문에서처럼 기억의 최근성(recency), 중요도(importance), 관련성(relevance) 세 가지 점수를 가중 합산해서 상위 기억을 인출하는 스코어링 함수를 구현하는 것이 핵심입니다.
