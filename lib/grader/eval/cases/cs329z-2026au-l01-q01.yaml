questionId: cs329z-2026au-l01-q01
cases:
  - id: cs329z-2026au-l01-q01-e1
    type: correct
    answer: |
      LLM 에이전트의 뼈대는 크게 다섯 가지 핵심 요소로 이루어져 있는데, 가장 밑바탕에 두뇌 역할을 하는 기반 모델인 LLM 코어(LLM core)가 자리 잡고 있습니다.
      그 위에 복잡한 과업을 작은 하위 단계로 쪼개고 무엇을 할지 생각하는 계획 및 추론(planning/reasoning) 모듈, 몇 시간짜리 긴 작업에서도 지금까지 일어난 실행 이력을 컨텍스트로 보존해 주는 메모리(memory), 그리고 웹 검색이나 계산기처럼 언어모델 혼자서는 정확히 처리하기 힘든 일을 수행하는 외부 도구(tool use)가 결합됩니다.
      다섯 번째 요소는 에이전트가 몸담고 상호작용하는 외부 환경(environment observation)으로, 에이전트는 추론을 거쳐 도구로 행동을 취하고 그 결과로 바뀐 환경을 관찰한 뒤 그 관찰값을 메모리에 쌓아 다시 다음 추론을 이어가는 폐루프(loop)로 작동합니다.
      결국 코딩 에이전트든 웹 브라우징 에이전트든 모두 이 5요소 루프의 변형일 뿐이며, 실제 에이전트의 성능 차이는 각 박스를 어떤 방식으로 구현하고 얼마나 매끄럽게 맞물리도록(하네스 최적화) 설계하느냐에서 갈립니다.
    label: null
  - id: cs329z-2026au-l01-q01-e2
    type: partial
    omits: [c3]
    answer: |
      에이전트를 분해해 보면 우선 중심에 파운데이션 모델인 LLM 코어가 있고, 큰 목표를 단계별로 나누고 사고하는 계획·추론 모듈이 있습니다.
      여기에 과거 스텝들의 궤적을 기억해서 맥락을 이어주는 메모리와, 실시간 정보 검색이나 정밀 연산처럼 모델 파라미터만으로는 안 되는 작업을 처리하는 도구 호출 모듈, 그리고 마지막으로 상호작용 대상인 환경이 더해져 총 5가지 요소로 구성됩니다.
      이 다섯 요소는 단발성으로 끝나는 게 아니라, LLM이 메모리를 참고해 추론·계획을 세우고 도구를 통해 환경에 행동을 가하면 환경으로부터 새로운 관찰(observation)을 돌려받아 다시 다음 추론으로 순환하는 루프 구조를 이룹니다.
    label: null
  - id: cs329z-2026au-l01-q01-e3
    type: misconception
    note: "에이전트 = 프롬프트 한 번 호출이라고 보고 루프·환경 관찰을 빠뜨림"
    answer: |
      LLM 에이전트는 기본적으로 LLM 코어에 계획·추론 지시문, 메모리 역할을 하는 시스템 프롬프트, 그리고 도구 명세를 한 번에 묶어서 넣은 구조를 말합니다.
      즉 사용자가 질문을 던졌을 때 잘 짜인 프롬프트를 딱 한 번 호출해서 모델이 한 번의 추론 패스 안에 계획부터 도구 선택, 최종 답변까지 단번에 출력해 내는 원샷 파이프라인이 바로 에이전트입니다.
      따라서 외부 환경의 변화를 다시 관찰해서 재추론하는 복잡한 반복 루프 없이, 단일 프롬프트 호출 안에서 각 요소를 어떻게 작성하고 조합하느냐가 에이전트 설계의 전부라고 볼 수 있습니다.
    label: null
  - id: cs329z-2026au-l01-q01-e4
    type: offtopic
    answer: |
      인공지능에서 에이전트라는 단어의 어원을 거슬러 올라가면 '행동하는 주체'를 뜻하는 라틴어에서 유래했고, 컴퓨터 과학에서는 1973년 Hewitt의 ACTOR 모델에서 처음 본격적으로 등장했습니다.
      이후 1980년대에는 에이전트끼리 과업을 협상하고 나누는 계약망 프로토콜이나 Marvin Minsky의 '마음의 사회(Society of Mind)' 같은 초기 다중 에이전트 개념으로 이어졌거든요.
      1990년대와 2000년대에는 DQN이나 AlphaGo 같은 심층 강화학습 에이전트가 특정 게임에서 초인적인 성능을 보여주었는데, 최근에 와서야 LLM의 인컨텍스트 학습 덕분에 범용성이 열리게 되었습니다.
    label: null
  - id: cs329z-2026au-l01-q01-e5
    type: english
    answer: |
      An LLM agent is built around five core components: the underlying foundation model (LLM core), a planning and reasoning module that decomposes large tasks into steps, a memory module that retains historical traces across long horizons, tools for factual actions like search or computation, and the external environment.
      Rather than running in a single pass, these pieces operate in a continuous loop where the LLM reasons over its memory, executes an action via tool calls, and receives new observations from the environment to inform its next thought.
      Every modern agent—whether it browses the web, runs terminal commands, or writes code—is essentially an instantiation of this same five-component skeleton.
      What differentiates one agent system from another is how each individual module is implemented and how tightly the pieces are integrated and optimized together.
