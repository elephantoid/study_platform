questionId: cs329z-2026au-l01-q11
cases:
  - id: cs329z-2026au-l01-q11-e1
    type: correct
    answer: |
      시스템 관점에서 단일 도구 호출이 처리되는 과정을 보면, 먼저 모델이 컨텍스트에 주어진 도구 스키마 목록 중에서 사용할 도구를 선택(tool selection)하고 과업에 맞게 인자(arguments) 필드들을 채워 넣습니다.
      그다음 검증기(validator)가 이 인자들이 스키마 규격(예: 경로가 문자열인지 등)에 맞는지 검사하는데, 이때 제약 디코딩(constrained decoding)을 적용하면 모델이 애초에 형식이 깨진 잘못된 호출을 생성하지 못하도록 원천 차단할 수 있습니다.
      검증을 통과한 호출은 안전을 위해 격리된 샌드박스(sandbox) 환경에서 실제로 실행되고, 거기서 나온 실행 결과(예: 읽어들인 파일 내용)가 다시 모델의 컨텍스트로 반환되어 다음 추론에 쓰입니다.
      한편 모든 AI 앱(Claude Desktop, IDE, Claude Code 등)이 수많은 외부 데이터 소스나 도구(SQL, Google Drive, Slack 등)마다 일일이 맞춤형 연동 코드를 따로 짜야 한다면 절대 확장될 수 없는데, MCP(Model Context Protocol)는 양방향 표준 프로토콜로 그 중간을 이어주어 도구를 MCP 서버로 한 번만 만들어 두면 어떤 MCP 클라이언트에서든 곧바로 연결해 쓸 수 있게 해줍니다.
    label: null
  - id: cs329z-2026au-l01-q11-e2
    type: partial
    omits: [c2]
    answer: |
      에이전트가 도구를 한 번 호출할 때는 우선 컨텍스트 내 스키마들 중 적절한 도구를 선택하고 필요한 인자 값을 채운 뒤, 검증기를 통해 그 인자들이 스키마에 부합하는지 확인합니다.
      이후 해당 도구를 보통 격리된 샌드박스 안에서 실행하고, 실행해서 얻은 결과값을 다시 모델의 컨텍스트로 돌려주어 사용자가 읽거나 다음 단계에 쓰도록 합니다.
      만약 모든 AI 애플리케이션이 각각의 데이터베이스나 외부 도구마다 개별적인 커스텀 연동을 구현해야 한다면 확장이 불가능한데, MCP는 이를 표준 프로토콜로 해결하여 도구를 MCP 서버로 한 번만 구축하면 어떤 MCP 클라이언트와도 연동할 수 있게 해줍니다.
    label: null
  - id: cs329z-2026au-l01-q11-e3
    type: misconception
    note: "MCP가 모델 디코딩 단계에서 스키마 검증 없이 모델 가중치를 직접 파인튜닝해 도구 호출을 학습시키는 알고리즘이라고 설명함"
    answer: |
      도구 호출은 모델이 도구를 고르고 인자를 채운 뒤 샌드박스에서 실행해 결과를 컨텍스트로 받는 과정인데, 이때 스키마 검증이나 제약 디코딩 같은 시스템 단계는 따로 존재하지 않습니다.
      대신 MCP(Model Context Protocol)라는 신경망 학습 알고리즘을 써서 모델의 디코딩 가중치 자체를 직접 경사하강법으로 파인튜닝함으로써 잘못된 호출이 나오지 않게 학습시킵니다.
      즉 MCP는 클라이언트와 외부 도구를 연결하는 통신 프로토콜이 아니라, 단일 모델 내부에서 스키마 검증기를 대체하기 위해 고안된 가중치 미세조정 기법입니다.
    label: null
  - id: cs329z-2026au-l01-q11-e4
    type: offtopic
    answer: |
      도구 실행용 샌드박스를 클라우드 인프라에 구축할 때는 컨테이너 탈출 공격이나 호스트 커널 침해를 막기 위해 일반 Docker 컨테이너보다 Firecracker 마이크로VM이나 gVisor 같은 강한 격리 기술을 쓰는 것이 안전합니다.
      특히 코딩 에이전트가 임의의 셸 스크립트를 실행할 때는 네트워크 이그레스(egress)를 기본적으로 차단해 두어야 내부 환경변수나 시크릿 키가 외부 공격자 서버로 유출되는 걸 막을 수 있거든요.
      또한 CPU와 메모리 사용량에 cgroups 리미트를 걸어두어야 포크 폭탄(fork bomb) 같은 리소스 고갈 장애를 예방할 수 있습니다.
    label: null
  - id: cs329z-2026au-l01-q11-e5
    type: english
    answer: |
      From a systems perspective, a single tool call goes through several stages: first, the model selects a tool from the schemas in its context and fills in the required arguments; next, a validator checks those arguments against the schema—often reinforced with constrained decoding so the model cannot produce an ill-formed call in the first place.
      Finally, the call is executed inside an isolated sandbox and the returned output (such as a file's contents) is fed back into the model's context.
      At the ecosystem level, if every AI application (like Claude Desktop, IDEs, or Claude Code) had to write custom integrations for every external data source and tool (such as SQL, Google Drive, or Slack), nothing would scale.
      The Model Context Protocol (MCP) solves this by providing a bidirectional standard protocol in the middle, so a tool can be built once as an MCP server and used seamlessly by any MCP client.
    label: null
