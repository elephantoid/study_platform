questionId: cs329z-2026au-l01-q09
cases:
  - id: cs329z-2026au-l01-q09-e1
    type: correct
    answer: |
      Toolformer는 언어모델이 텍스트를 디코딩하며 생성하는 도중에 어느 위치에서, 언제, 어떤 API를 호출해 특수 토큰으로 끼워 넣어야 할지를 스스로 학습하게 한 초기 연구로, 당시에는 계산기·질의응답·검색엔진·번역기·달력 이렇게 5가지의 소수 기본 도구만 다뤘습니다.
      반면 Berkeley에서 나온 Gorilla는 Hugging Face, Torch Hub, TensorFlow Hub에 걸쳐 있는 1,600개 이상의 방대한 실제 API들로부터 합성 데이터(synthetic data)를 생성해 7B 모델을 학습시켰고, 추론 시점에는 문서 검색(retrieval)을 결합해 적절한 API를 찾아 호출하도록 확장했습니다.
      이렇게 모델이 직접 하기 힘든 계산이나 이미지 생성(예: 고양이 춤 이미지를 Stable Diffusion에 맡기기) 같은 작업을 외부 전문 도구에 위임하면, 기반 모델이 억지로 지어내려다 틀리는 대신 정확한 API 호출만 수행해 검증된 결과를 받아오므로 훨씬 사실적이고 일관된 출력을 얻고 환각(hallucination)을 대폭 줄일 수 있습니다.
    label: null
  - id: cs329z-2026au-l01-q09-e2
    type: partial
    omits: [c2]
    answer: |
      우선 Toolformer는 모델이 문장을 생성해 나가는 디코딩 과정 속에서 정확히 어디서, 언제, 어떤 API를 호출할지를 특수 토큰과 함께 학습시킨 선구적인 연구인데, 당시에는 계산기, 질의응답, 검색, 번역, 달력 같은 소수의 제한된 도구 세트만 가르쳤습니다.
      이처럼 언어모델이 혼자 힘으로 처리하기 어려운 연산이나 최신 사실 조회, 이미지 생성 같은 과업을 외부 전문 도구에 위임하게 되면 모델 스스로 모든 걸 기억하고 생성할 필요가 없어집니다.
      덕분에 외부 도구가 돌려주는 정확한 값을 받아서 생성에 활용할 수 있기 때문에 훨씬 더 사실적이고 일관된 답변이 나오며 환각(hallucination)이 크게 줄어듭니다.
    label: null
  - id: cs329z-2026au-l01-q09-e3
    type: misconception
    note: "Gorilla와 Toolformer가 외부 API를 호출하지 않고 이미지 생성이나 계산 기능을 LLM 가중치 내부에 직접 내재화해 환각을 줄인다고 설명함"
    answer: |
      Toolformer와 Gorilla의 핵심 목표는 추론 시점에 번거롭게 외부 API나 검색기(retrieval)를 실제로 호출하지 않고도, 계산기·달력 기능이나 Hugging Face·Torch Hub·TensorFlow Hub의 1,600개 모델 기능을 LLM 가중치 내부에 통째로 흡수해 내재화하는 것입니다.
      즉 Stable Diffusion 같은 외부 이미지 생성 도구나 외부 계산기에 작업을 위임하는 것이 아니라, 7B 언어모델 자체가 학습을 통해 직접 픽셀 이미지를 그리고 모든 계산을 자기 파라미터 안에서 단독으로 끝내도록 만듭니다.
      이렇게 외부 도구에 전혀 의존하지 않고 언어모델 혼자서 모든 작업을 직접 수행하도록 학습시키기 때문에 외부 API 오류 없이 환각이 줄어드는 것입니다.
    label: null
  - id: cs329z-2026au-l01-q09-e4
    type: offtopic
    answer: |
      함수 호출(Function Calling) 벤치마크에서 모델의 도구 사용 능력을 정량 평가할 때는 Berkeley Function Calling Leaderboard(BFCL)를 가장 널리 참고합니다.
      실제 프로덕션에서 도구 호출을 운영해 보면 단일 함수를 부르는 건 작은 모델도 잘하지만, 여러 도구를 순차적으로 연쇄 호출하거나 병렬로 동시에 호출해야 할 때 JSON 구문 에러가 자주 나거든요.
      그래서 도구 설명(description)을 작성할 때 각 파라미터의 타입과 허용되는 enum 값, 그리고 언제 이 도구를 쓰지 말아야 하는지를 명확히 적어주는 프롬프트 엔지니어링이 중요합니다.
    label: null
  - id: cs329z-2026au-l01-q09-e5
    type: english
    answer: |
      Toolformer was an early approach that taught LLMs where, when, and which API call to trigger via special tokens directly during the text decoding process, though it only covered a small set of about five tools like a calculator, QA system, search engine, translator, and calendar.
      Gorilla scaled tool learning to thousands of APIs by generating synthetic training data from over 1,600 APIs across Hugging Face, Torch Hub, and TensorFlow Hub to train a 7B model, pairing it with retrieval at inference time to select the right API.
      Delegating tasks like arithmetic or image generation (for example, calling Stable Diffusion) to external tools reduces hallucination because the base LLM no longer has to fabricate answers or capabilities from its own weights, enabling far more factual and consistent generation.
    label: null
