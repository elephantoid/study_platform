questionId: cme295-2025au-l01-q08
cases:
  - id: cme295-2025au-l01-q08-e1
    type: correct
    answer: |
      기계 번역을 기준으로 보면 먼저 encoder의 self-attention에서는 출발어 입력 문장의 토큰들이 Q, K, V를 모두 자기들끼리 주고받으며 서로를 참조해서 문맥이 풍부하게 반영된 입력 표현을 만들어 냅니다.
      반면 decoder의 첫 번째 층인 masked self-attention은 지금까지 번역해 낸 타깃 토큰들 안에서만 Q, K, V를 계산하되, 아직 생성하지도 않은 오른쪽 미래 토큰들은 컨닝하지 못하도록 마스킹으로 가려버립니다.
      그다음 이어지는 decoder의 cross-attention이 두 영역을 이어주는 핵심인데, 여기서는 지금 다음 단어를 예측하려는 decoder 쪽에서 query(Q)가 올라오고, encoder가 만들어 둔 입력 문장 표현에서 key(K)와 value(V)가 넘어와서 원문의 어느 단어에 집중할지 조회합니다.
      마지막으로 이 모든 attention은 토큰들을 한 번에 직접 연결하기 때문에 RNN처럼 자연스러운 순서 감각이 아예 없어서, 각 토큰이 문장 몇 번째에 있는지를 알려주는 position encoding을 임베딩에 꼭 더해줘야 합니다.
