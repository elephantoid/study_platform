  - id: cme295-2025au-l01-q08-e2
    type: partial
    omits: [c4]
    answer: |
      원 논문 Transformer에는 총 세 군데의 attention 층이 있는데, 우선 왼쪽 encoder의 self-attention은 입력 문장 토큰들이 서로에게 attend하면서 각 토큰의 문맥화된 임베딩을 계산합니다(Q, K, V 모두 encoder 입력에서 생성).
      오른쪽 decoder에 들어가면 첫 번째로 masked self-attention을 거치는데, 여기서는 현재 시점까지 디코딩된 타깃 토큰들만 참조할 수 있고 아직 번역되지 않은 오른쪽 토큰들은 마스킹해서 보지 못하게 막습니다.
      두 번째 층인 cross-attention에서는 decoder의 현재 상태가 query(Q)가 되고, encoder의 최종 출력이 key(K)와 value(V) 역할을 맡아서 타깃 단어를 생성할 때 입력 문장의 어떤 정보가 중요한지를 끌어오게 됩니다.
