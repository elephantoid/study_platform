  - id: cme295-2025au-l01-q08-e3
    type: misconception
    note: "cross-attention에서 key와 value가 decoder에서 온다고 설명한다"
    answer: |
      먼저 encoder self-attention은 입력 토큰들이 서로를 참조해서 원문의 문맥 표현을 학습하는 층입니다.
      그리고 decoder의 masked self-attention은 지금까지 생성된 앞쪽 토큰들만 보도록 미래 방향을 가려주는 역할을 합니다.
      이어지는 cross-attention에서는 반대로 encoder가 보낸 원문 벡터가 query(Q)가 되고, 지금까지 번역 중인 decoder 쪽에서 key(K)와 value(V)가 올라와서 원문 쿼리와 매칭을 수행합니다.
      또한 어텐션은 모든 토큰을 직접 연결하므로 단어 순서 정보를 넣어주기 위해 position encoding을 입력 임베딩에 더해 주어야 합니다.
    label: null
  - id: cme295-2025au-l01-q08-e4
    type: offtopic
    answer: |
      2017년 원 논문에서는 encoder와 decoder를 둘 다 가진 구조로 시작했지만, 이후 모델들은 태스크 특성에 따라 encoder만 쓰거나 decoder만 쓰는 방향으로 크게 갈라졌습니다.
      예를 들어 BERT처럼 문장 분류나 개체명 인식에 특화된 모델은 양방향 문맥만 잘 파악하면 되니까 encoder 블록만 쌓아서 마스킹된 빈칸을 맞히게 학습하거든요.
      반대로 오늘날 우리가 쓰는 GPT 계열이나 Llama 같은 생성형 거대언어모델은 cross-attention과 encoder를 아예 걷어내고 causal decoder 블록만 깊게 쌓는 구조를 택하고 있습니다.
    label: null
  - id: cme295-2025au-l01-q08-e5
    type: english
    answer: |
      In the original encoder-decoder Transformer, the encoder's self-attention derives Q, K, and V from the source sentence so that all input tokens attend to one another and build contextualized representations.
      In the decoder, the masked self-attention layer computes Q, K, and V from the target tokens generated so far while masking out future positions on the right so the model cannot peek ahead.
      Next, the cross-attention layer bridges the two sides by taking the query (Q) from the decoder and the keys (K) and values (V) from the encoder's output to determine which source words matter for predicting the next target word.
      Finally, because direct attention links treat tokens in parallel without any inherent notion of sequential order, we must add position encodings to the token embeddings to inject word-order information.
    label: null
