  - id: cme295-2025au-l01-q11-e2
    type: partial
    omits: [c2]
    answer: |
      계산 과정을 보면 h개의 head가 각각 별도의 학습 가능한 `W_q, W_k, W_v` 투영 행렬을 사용해 입력 임베딩을 서로 다른 부분 공간으로 보내고 병렬로 self-attention을 계산합니다.
      각 head에서 나온 h개의 결과 행렬들은 열 방향으로 concatenate한 뒤, 마지막 선형 투영 행렬인 `W_o`를 곱해서 원래의 임베딩 차원과 똑같은 크기로 맞춰 줍니다.
      이렇게 여러 head를 두었을 때 각 head가 똑같은 걸 중복해서 배우지 않고 다양해지는 이유는, 다음 단어 예측이라는 목적 함수를 최소화하는 과정에서 gradient descent가 모델에게 주어진 자유도를 최대한 유용하게 활용하도록 가중치를 업데이트하기 때문입니다.
