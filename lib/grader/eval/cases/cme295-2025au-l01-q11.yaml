  - id: cme295-2025au-l01-q11-e3
    type: misconception
    note: "head마다 서로 다른 표현을 갖도록 별도의 제약이나 정규화 항이 들어간다고 설명한다"
    answer: |
      multi-head attention은 h개의 head마다 고유한 `W_q, W_k, W_v` projection matrix를 두어 어텐션을 병렬로 계산한 뒤, 그 결과들을 열 방향으로 concatenate하고 `W_o` 행렬을 곱해 원래 임베딩 차원으로 복원합니다.
      만약 아무런 조치를 하지 않으면 모든 head가 똑같은 가중치로 수렴해 버리기 때문에, 트랜스포머는 학습할 때 각 head의 투영 행렬들이 서로 직교하도록 강제하는 별도의 직교 정규화(orthogonality regularization) 제약 항을 손실 함수에 반드시 추가합니다.
      이 명시적인 다양성 제약 항과 gradient descent가 함께 작동하기 때문에 각 head가 겹치지 않고 서로 다른 문법적·의미적 표현을 학습할 수 있는 것입니다.
    label: null
  - id: cme295-2025au-l01-q11-e4
    type: offtopic
    answer: |
      최근 거대언어모델에서는 기본적인 Multi-Head Attention(MHA)을 그대로 쓰면 추론 시 KV 캐시 메모리 사용량이 헤드 수 h에 비례해서 너무 커지는 문제가 있습니다.
      그래서 Llama 2나 Llama 3 같은 최신 아키텍처에서는 모든 쿼리 헤드가 하나의 키·밸류만 공유하는 Multi-Query Attention(MQA)이나, 몇 개의 그룹으로 묶어서 키·밸류를 공유하는 Grouped-Query Attention(GQA)으로 대체하는 추세거든요.
      더 나아가 DeepSeek 같은 모델은 키와 밸류를 저차원 잠재 벡터로 압축하는 MLA(Multi-head Latent Attention)를 써서 추론 처리량을 크게 끌어올리고 있습니다.
    label: null
  - id: cme295-2025au-l01-q11-e5
    type: english
    answer: |
      In multi-head attention, we run h self-attention computations in parallel, where each head uses its own learned projection matrices `W_q, W_k, W_v` to project the embeddings into different subspaces.
      The resulting h output matrices are concatenated along their columns and multiplied by an output projection matrix `W_o` to project the combined representation back to the original embedding dimension.
      Notably, there is no explicit constraint in the architecture or loss function forcing different heads to learn distinct representations.
      Instead, diversity emerges naturally through gradient descent: because the model's objective function incentivizes representations that best predict the next token, duplicating the exact same projection across heads provides no benefit, so optimization utilizes those extra degrees of freedom to capture different relationships.
