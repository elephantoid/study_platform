questionId: cme295-2025au-l01-q11
cases:
  - id: cme295-2025au-l01-q11-e1
    type: correct
    answer: |
      multi-head attention은 단일 어텐션을 한 번만 돌리는 대신, h개의 head마다 각자 독립적으로 학습되는 `W_q, W_k, W_v` projection matrix 세트를 두어 h개의 self-attention 연산을 병렬로 수행하는 구조입니다.
      그렇게 병렬로 계산해서 나온 h개의 출력 행렬들을 열(column) 방향으로 길게 이어 붙인(concatenate) 다음, 마지막에 출력 투영 행렬인 `W_o`를 곱해서 원래의 입력 임베딩 차원(`d_model`) 크기로 깔끔하게 되돌려 놓습니다.
      재미있는 점은 모델의 손실 함수나 아키텍처 어디에도 각 head가 서로 다른 표현을 배우도록 강제하는 명시적인 제약 조건이 전혀 없다는 사실인데요.
      그럼에도 불구하고 실제로 학습을 시켜보면, 다음 단어를 가장 잘 예측해야 한다는 목적 함수 아래에서 gradient descent가 최적화를 수행할 때 똑같은 연산을 중복해서 복사하는 것보다 주어진 추가 자유도를 활용해 서로 다른 문맥 연관성을 포착하는 편이 손실을 줄이는 데 훨씬 유리하기 때문에 자연스럽게 다양한 표현으로 수렴하게 됩니다.
