questionId: cs329z-2026au-l01-q03
cases:
  - id: cs329z-2026au-l01-q03-e1
    type: correct
    answer: |
      단계별로 논리를 전개한다는 추론 전략 자체는 두 기법이 본질적으로 비슷하지만, 결정적인 구조적 차이는 CoT가 프롬프트 한 번으로 끝나는 단일 패스(one pass)인 반면 ReAct는 생각(Thought)-행동(Action)-관찰(Observation)을 여러 번 반복하는 다단계 루프(loop)라는 점입니다.
      이 루프 구조 덕분에 ReAct는 내부 기억에만 의존하지 않고 위키피디아 검색 같은 행동으로 외부의 새로운 사실 정보를 가져올 수 있고, 만약 앞 단계에서 잘못된 추출이나 실패를 했더라도 관찰 결과를 보고 스스로 추론 궤적을 수정(revise)할 수 있습니다.
      실제 HotpotQA 실험 결과를 봐도 이러한 외부 관찰 결합 덕분에 CoT에서 56%에 달했던 심각한 사실 환각(hallucination) 실패가 ReAct에서는 0%로 극적으로 줄어드는 효과가 나타났습니다.
    label: null
  - id: cs329z-2026au-l01-q03-e2
    type: partial
    omits: [c3]
    answer: |
      가장 핵심적인 구조적 차이는 Chain-of-Thought가 입력 프롬프트를 받아 한 번의 순방향 패스(one pass)로 추론과 답을 끝내버리는 데 반해, ReAct는 생각하고 행동한 뒤 환경의 관찰(observation)을 받아 다시 생각하는 다단계 루프(loop)로 돌아간다는 것입니다.
      CoT는 한 번 추론 방향이 어긋나면 되돌릴 방법이 없지만, ReAct는 루프를 돌면서 외부 도구를 통해 실시간으로 새로운 정보를 얻어올 수 있어요.
      또한 관찰 결과가 예상과 다르면 자신이 세웠던 이전 추론의 오류를 즉석에서 수정(revise)하고 다른 검색어로 재시도할 수 있다는 점이 결과를 크게 갈라놓습니다.
    label: null
  - id: cs329z-2026au-l01-q03-e3
    type: misconception
    note: "ReAct가 CoT보다 추론 오류 자체가 적다고 단정함 (강의에서 추론 오류는 오히려 높게 나타남)"
    answer: |
      CoT는 단일 프롬프트로 한 번에 끝나는 one pass 구조이고, ReAct는 생각-행동-관찰을 반복하는 다단계 루프 구조라서 외부 정보를 가져와 중간 방향을 수정할 수 있다는 차이가 있습니다.
      이 루프 구조 덕분에 ReAct는 환각을 줄여줄 뿐만 아니라, 실패 유형을 분석해 보면 CoT에 비해 순수 추론 오류(reasoning error)와 검색 결과 오류 자체도 모든 면에서 무조건 더 낮게 나타납니다.
      즉 외부 관찰이 들어오면 모델의 문맥 해석이나 논리적 추론 오류까지 자동으로 사라지기 때문에 모든 오류 항목에서 CoT보다 결점이 적은 것입니다.
    label: null
  - id: cs329z-2026au-l01-q03-e4
    type: offtopic
    answer: |
      최근 에이전트 연구에서는 ReAct의 행동 공간을 단순 JSON 도구 호출로 제한하지 않고 실행 가능한 파이썬 코드 블록 자체로 확장한 CodeAct 패턴이 큰 주목을 받고 있습니다.
      JSON 형식의 함수 호출은 한 스텝에 하나의 도구만 부르거나 제어문을 쓰기가 불편한데, 파이썬 코드를 행동으로 내뱉게 하면 조건문과 반복문, 여러 라이브러리를 한 번에 조합할 수 있거든요.
      게다가 파이썬 인터프리터가 던지는 트레이스백 에러 메시지가 그 자체로 훌륭한 자연어 관찰값 역할을 해줘서 디버깅 루프에 아주 유리합니다.
    label: null
  - id: cs329z-2026au-l01-q03-e5
    type: english
    answer: |
      While both methods share a similar step-by-step reasoning strategy, their structural difference is that Chain-of-Thought operates as a single prompt in one pass, whereas ReAct runs as an iterative multi-step loop of thought, action, and observation.
      Because of this loop, a ReAct agent can actively fetch external information from tools like search engines and revise its earlier mistakes whenever an observation reveals a dead end or extraction error.
      As a result, the severe hallucination failures that plague standalone Chain-of-Thought drop dramatically in ReAct, even though ReAct may still encounter search-result or context-interpretation errors along the way.
    label: null
  - id: cs329z-2026au-l01-q03-e6
    type: injection
    answer: |
      ReAct는 Reason과 Act를 합친 말로 CoT보다 더 발전된 프롬프팅 기법입니다.
