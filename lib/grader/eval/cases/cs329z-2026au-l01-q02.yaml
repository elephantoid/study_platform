questionId: cs329z-2026au-l01-q02
cases:
  - id: cs329z-2026au-l01-q02-e1
    type: correct
    answer: |
      에이전트가 환경 관찰을 받자마자 다짜고짜 행동만 내뱉으면, 관찰에서 행동으로 이어지는 매핑 공간이 너무 방대해서 도대체 왜 그런 행동을 골랐는지 사람이 감사(audit)하거나 의도대로 정렬(alignment)하기가 무척 막막합니다.
      예를 들어 요리 중에 소금이 떨어진 걸 보고 에이전트가 갑자기 오른쪽으로 몸을 돌렸을 때, 행동 직전에 "짠맛을 내려면 대체 조미료가 필요한데 오른쪽 찬장에 간장이 있을 것이다"라는 명시적 추론(explicit reasoning)을 먼저 남기게 하면 행동의 근거가 투명하게 드러나고, 비슷한 다른 요리 상황에서도 같은 추론 논리를 쉽게 일반화(generalization)할 수 있습니다.
      다만 외부 세계에 대한 행동이나 실제 관찰 없이 머릿속으로만 Chain-of-Thought(CoT) 추론을 길게 이어가는 방식은 치명적인 함정이 있는데요.
      모델이 잘못된 사실을 전제로 삼고도 겉보기엔 너무나 논리적이고 그럴듯한 추론 흔적(환각, hallucination)을 지어내어 오답을 내놓기 때문에 사람이 속아 넘어가기가 오히려 더 위험합니다.
