  - id: cs329z-2026au-l01-q02-e3
    type: misconception
    note: "추론 트레이스가 모델 내부 계산을 항상 충실히 반영한다고 단정함"
    answer: |
      행동 직전에 명시적인 추론 텍스트를 생성하게 하면 관찰에서 행동으로 넘어가는 이유를 사람이 읽을 수 있어 감사와 정렬에 큰 도움이 되고, 동일한 추론 패턴을 유사한 새로운 문제에도 일반화해 적용할 수 있습니다.
      특히 LLM이 출력하는 Chain-of-Thought 추론 트레이스는 신경망 내부의 실제 가중치 연산과 활성화 과정을 언제나 100% 한 치의 오차도 없이 충실하게(faithfully) 그대로 비춰주는 거울이라는 점이 가장 큰 장점입니다.
      다만 외부 관찰 없이 CoT만 단독으로 쓰면 외부 최신 지식이 없을 때 그럴듯한 환각을 만들어 틀린 답을 낼 수 있다는 점만 주의하면 됩니다.
    label: null
  - id: cs329z-2026au-l01-q02-e4
    type: offtopic
    answer: |
      Chain-of-Thought 프롬프팅의 성능을 더 끌어올리기 위해 실무에서 가장 흔히 쓰는 트릭은 Self-Consistency(자기 일관성)와 Tree-of-Thoughts입니다.
      Self-Consistency는 온도(temperature)를 0보다 크게 두고 하나의 질문에 대해 여러 갈래의 다양한 추론 경로를 샘플링한 다음, 마지막에 도출된 최종 정답들 중에서 다수결 투표로 가장 일관되게 나온 답을 채택하는 방식이거든요.
      이렇게 여러 번 샘플링해서 투표를 거치면 단일 경로에서 우연히 발생한 산술 실수나 사소한 착오를 꽤 효과적으로 걸러낼 수 있습니다.
    label: null
  - id: cs329z-2026au-l01-q02-e5
    type: english
    answer: |
      Because the direct mapping from environment observations to actions is vast and opaque, having an agent generate an explicit reasoning trace before acting makes its decision process interpretable, which greatly aids auditing and alignment.
      In addition, explicit reasoning improves generalization because the same high-level deduction—such as looking for a savory substitute when salt runs out—can transfer cleanly to new, analogous situations.
      However, relying on standalone Chain-of-Thought (CoT) without external actions or environment observations carries a severe risk of hallucination.
      A pure CoT model can fabricate a highly convincing, coherent reasoning chain built on false premises and arrive at the wrong answer, which is even more dangerous because the plausible trace can mislead human reviewers.
