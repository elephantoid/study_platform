  - id: cs329z-2026au-l01-q02-e2
    type: partial
    omits: [c2]
    answer: |
      만약 에이전트가 현재 상태를 관찰하고 곧장 행동으로 점프해 버리면 제3자 입장에서 왜 저런 행동을 했는지 블랙박스처럼 불투명해서 시스템 감사나 정렬 디버깅이 거의 불가능합니다.
      행동을 취하기 직전에 명시적인 추론(thought) 단계를 끼워 넣으면 에이전트가 어떤 의도로 그 행동을 선택했는지 해석 가능성(interpretability)이 확보되어 감사와 정렬이 훨씬 수월해져요.
      하지만 외부 도구 호출이나 환경 관찰 없이 오직 내부적인 Chain-of-Thought에만 의존하면, 사실과 다른 환각(hallucination)을 바탕으로 아주 그럴듯하고 설득력 있는 거짓 추론 사슬을 만들어 틀린 답을 낼 위험이 크다는 한계가 있습니다.
