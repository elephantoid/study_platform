  - id: cme295-2025au-l01-q03-e5
    type: english
    answer: |
      Word-level tokenization is simple, but it treats closely related words like "bear" and "bears" as completely separate tokens without sharing their common root, and it suffers from a high risk of out-of-vocabulary (OOV) tokens at inference time.
      Character-level tokenization avoids OOV issues and handles misspellings or casing errors well, yet it is hard to assign meaningful representations to individual letters and it produces extremely long sequences.
      Subword tokenization strikes a middle ground by leveraging shared word roots and drastically reducing OOV risk, at the cost of making sequences somewhat longer than word-level tokenization.
      Because a model's computation time scales with sequence length, subword tokenization is the best default choice to balance root sharing, OOV mitigation, and computational efficiency.
    label: null
