questionId: cme295-2025au-l01-q03
cases:
  - id: cme295-2025au-l01-q03-e1
    type: correct
    answer: |
      먼저 단어 단위(word-level) 방식은 직관적이긴 하지만 run과 runs, bear와 bears처럼 어근이 같은 단어들도 완전히 별개의 토큰으로 쪼개버려서 공통 어근의 의미를 살리지 못하고, 학습 때 안 나온 단어가 추론 시 등장하면 전부 OOV(미등록어)가 되어버리는 치명적인 단점이 있습니다.
      반대로 문자 단위(character-level)로 내려가면 오타나 대소문자 실수에도 잘 버티고 OOV 문제도 사라지지만, 개별 알파벳 한 글자가 무슨 뜻인지 표현하기가 모호하고 문장이 너무 긴 토큰 시퀀스로 늘어납니다.
      중간 지점인 서브워드(subword) 방식은 단어의 공통 어근을 공유하면서 OOV 발생 위험도 크게 낮춰주지만, 단어 단위보다는 시퀀스 길이가 다소 길어진다는 비용이 따릅니다.
      모델의 연산 복잡도와 추론 시간은 결국 처리해야 할 토큰 개수, 즉 시퀀스 길이에 직결되기 때문에 너무 느린 문자 단위나 OOV에 취약한 단어 단위 대신 어근 활용과 연산 효율의 균형이 가장 좋은 subword 방식을 기본으로 선택하겠습니다.
    label: null
  - id: cme295-2025au-l01-q03-e2
    type: partial
    omits: [c3]
    answer: |
      텍스트를 단어 단위로 쪼개는 word-level 토크나이저는 bear와 복수형 bears를 아무 관련 없는 별개 토큰으로 다루기 때문에 어근 정보를 공유하지 못하고, 훈련 데이터에 없던 단어를 만나면 OOV로 빠져버릴 위험이 아주 높습니다.
      이를 개선한 subword 토크나이저는 단어 내부의 공통 어근 조각을 재활용해서 의미 표현력을 높이고 OOV 위험도 확 줄여주는데, 대신 한 단어가 여러 조각으로 나뉘다 보니 전체 시퀀스 길이가 길어진다는 단점이 있어요.
      트랜스포머 같은 모델은 입력 시퀀스 길이가 길어질수록 처리해야 할 토큰 수가 많아져서 연산 시간이 크게 늘어나거든요.
      그런 시퀀스 길이 비용과 OOV 방지 및 어근 활용 사이의 트레이드오프를 따져봤을 때 실무에서는 subword 방식을 기본으로 채택하는 것이 가장 합리적입니다.
