  - id: cme295-2025au-l01-q03-e3
    type: misconception
    note: "subword 토크나이저가 OOV 문제를 완전히 없앤다고 주장한다"
    answer: |
      단어 단위 방식은 bear랑 bears처럼 형태만 조금 바뀐 단어도 별도의 임베딩으로 배워야 해서 어근을 전혀 못 살리고 OOV 문제가 빈번하게 터집니다.
      반면 문자 단위는 오타나 대소문자 변형에는 강하지만 알파벳 하나하나에 의미를 부여하기 힘들고 시퀀스 길이가 지나치게 길어져서 모델 추론 속도가 엄청나게 느려져요.
      그래서 저는 subword 방식을 기본으로 고를 텐데, 단어보다는 시퀀스가 약간 길어지긴 해도 공통 어근을 그대로 활용할 수 있기 때문입니다.
      무엇보다 subword 토크나이저를 쓰면 어떤 입력이 들어와도 OOV(Out-of-Vocabulary) 문제를 100% 완벽하게 제거할 수 있어서 미등록어 걱정을 아예 할 필요가 없습니다.
    label: null
  - id: cme295-2025au-l01-q03-e4
    type: offtopic
    answer: |
      토크나이저를 구현할 때는 정규표현식으로 공백과 구두점을 먼저 어떻게 전처리하느냐가 전체 파이프라인의 속도를 좌우합니다.
      예전에 다국어 챗봇 프로젝트를 할 때 한국어랑 영어, 이모지가 섞인 텍스트에서 유니코드 정규화(NFC/NFKD)를 안 해줬더니 똑같은 글자인데도 다른 토큰 아이디로 매핑되는 버그를 겪은 적이 있거든요.
      요즘에는 Rust로 작성된 고속 토크나이저 라이브러리를 써서 CPU 병목 없이 배치 단위로 빠르게 정수 인덱스로 변환해 주는 편입니다.
      또한 문장 시작과 끝을 알려주는 BOS, EOS 같은 특수 토큰과 패딩 토큰의 인덱스를 어휘 사전 맨 앞쪽에 고정해 두면 관리하기가 편합니다.
