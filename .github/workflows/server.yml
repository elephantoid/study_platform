name: server
on:
  pull_request:
    paths:
      - "server/**"
      - "content/**"
      - "pipeline/manifests/**"
      - ".github/workflows/server.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      # rustup on the runner installs the toolchain pinned in server/rust-toolchain.toml.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Integration tests load the real content/: invalid content fails here too.
      - run: cargo test --locked
